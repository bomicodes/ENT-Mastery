{% extends "base.html" %}{% block content %}
<div class="eyebrow">ACCOUNT</div>
<h1>Change your PIN</h1>
<p class="lede">Choose a new PIN for your own account.</p>
<section class="card pin-change-card">
  {% if error %}<div class="access-error" role="alert">{{error}}</div>{% endif %}
  {% if success %}<div class="access-success" role="status">{{success}}</div>{% endif %}
  <form method="post" class="access-form">
    <div class="access-field"><label for="old_pin">Current PIN</label><input id="old_pin" name="old_pin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <div class="access-field"><label for="new_pin">New PIN</label><input id="new_pin" name="new_pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="4–8 digits" required></div>
    <div class="access-field"><label for="confirm_pin">Confirm new PIN</label><input id="confirm_pin" name="confirm_pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></div>
    <button class="primary" type="submit">Save new PIN</button>
  </form>
</section>
{% endblock %}
