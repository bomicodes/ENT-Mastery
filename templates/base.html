<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}ENT Mastery{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brandmark">E</span><span><b>ENT Mastery</b><small>Residency → Boards</small></span></a>
    <nav>
      <a href="/" class="navitem">⌂ <span>Today</span></a>
      <a href="/daily-adaptive" class="navitem">🧭 <span>Daily Path</span></a>
      <a href="/curriculum" class="navitem">🗺 <span>Curriculum</span></a>
      <a href="/anatomy" class="navitem">⌖ <span>Anatomy Atlas</span></a>
      <a href="/integrated" class="navitem">🩺 <span>Cases</span></a>
      <a href="/lab" class="navitem">◈ <span>Interpretation Atlas</span></a>
      <a href="/case-tomorrow" class="navitem">⌁ <span>OR Tomorrow</span></a>
      <a href="/progress" class="navitem">▥ <span>Progress</span></a>
      <div class="nav-divider"></div>
      <a href="/attending" class="navitem">↗ <span>Attending / Chief</span></a>
      <a href="/mistakes" class="navitem">↻ <span>Mistakes</span></a>
      <a href="/search" class="navitem">⌕ <span>Search</span></a>
      <a href="/evidence" class="navitem">✓ <span>Evidence & Sources</span></a>
    </nav>
    <div class="sidebar-bottom"><a href="/sources">Sources & evidence</a><small>Educational use only</small></div>
  </aside>
  <main>
    <header class="topbar">
      <form action="/search" method="get" class="global-search">
        <span>⌕</span><input name="q" placeholder="Search disease, operation, anatomy, problem…" value="{{ request.args.get('q','') }}">
        <kbd>/</kbd>
      </form>
      <a class="case-btn" href="/case-tomorrow">🩺 Case Tomorrow</a>
    </header>
    <div class="page">{% block content %}{% endblock %}</div>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
