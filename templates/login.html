<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ENT Mastery · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='reliability_v168.css') }}">
</head>
<body class="access-page">
  <main class="access-shell">
    <section class="card access-card">
      <div class="modern-brand access-brand"><span class="modern-brand-ent">ENT</span><span>MASTERY</span></div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue your learning path.</p>
      {% if error %}<div class="access-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="access-form">
        <div class="access-field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="username" placeholder="Name on the roster" value="{{ request.form.get('name','') }}" required autofocus>
        </div>
        <div class="access-field">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="current-password" placeholder="4–8 digits" required>
        </div>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
