name: CI - Canonical Ladder Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit_domain_ladder_inventory_v217.py'
      - 'audit_hn_salvage_ladder_distinction_v288.py'
      - 'hn_salvage_ladder_alignment_v*.py'
      - 'runtime_entry.py'
      - 'data.py'
      - 'deep_curriculum_*.py'
      - 'clinical_hierarchy_v*.py'
      - 'vignette_ladders_v*.py'
      - 'ladder_answer_balance_v*.py'
      - '.github/workflows/domain-ladder-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: Head and Neck salvage ladder semantic distinction
        run: python audit_hn_salvage_ladder_distinction_v288.py
      - name: Reviewed ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py

# This fast workflow intentionally duplicates the canonical ladder checks at the
# front of the global quality suite. It exists so curriculum work can select and
# protect exact canonical gaps without waiting for the long route/Deep Curriculum/
# Concept Check chain to finish. The salvage semantic check protects the broad
# irradiated-field reasoning and the distinct post-CRT response-management layer
# inside the single live salvage canonical concept. The answer-balance gate also
# protects individualized rationale alignment after deterministic choice movement.
# This workflow does not replace or weaken the global gates.