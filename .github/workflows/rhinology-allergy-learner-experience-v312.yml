name: Rhinology Allergy learner experience v31.2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'audit_rhinology_allergy_learner_experience_v312.py'
      - 'audit_rhinology_allergy_source_semantic_v349.py'
      - 'deep_curriculum_*.py'
      - 'concept_check_*.py'
      - 'audit_concept_check_*.py'
      - 'templates/concept_check.html'
      - 'templates/daily_adaptive.html'
      - 'runtime_entry.py'
      - 'runtime_entry_pasha.py'
      - 'data.py'
      - 'app.py'
      - '.github/workflows/rhinology-allergy-learner-experience-v312.yml'
  push:
    branches: [main]
    paths:
      - 'audit_rhinology_allergy_learner_experience_v312.py'
      - 'audit_rhinology_allergy_source_semantic_v349.py'
      - 'deep_curriculum_*.py'
      - 'concept_check_*.py'
      - 'audit_concept_check_*.py'
      - 'templates/concept_check.html'
      - 'templates/daily_adaptive.html'
      - 'runtime_entry.py'
      - 'runtime_entry_pasha.py'
      - 'data.py'
      - 'app.py'
      - '.github/workflows/rhinology-allergy-learner-experience-v312.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Strict 325-topic canonical coverage
        run: python audit_coverage_v135.py --depth --strict
      - name: Full Rhinology canonical ladder gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Existing AR/LAR clinical and source-semantic gate
        run: python audit_rhinology_allergy_source_semantic_v349.py
      - name: AR/LAR learner-facing Deep to Concept to Daily and source-render gate
        shell: bash
        run: |
          set -o pipefail
          python audit_rhinology_allergy_learner_experience_v312.py | tee RHINOLOGY_ALLERGY_LEARNER_AUDIT.txt
      - name: Upload AR/LAR learner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhinology-allergy-learner-v312
          path: RHINOLOGY_ALLERGY_LEARNER_AUDIT.txt
          if-no-files-found: error
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Global fail-closed release integrity
        run: python audit_global_release_integrity_v311.py
