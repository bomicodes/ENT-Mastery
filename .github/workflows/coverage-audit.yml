jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: v20.4 runtime learning-ladder hard gate
        run: python audit_learning_ladders_runtime_v204.py
      - name: v21.7 explicit domain ladder inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: v23.2 full Otology ladder hard gate
        run: python audit_otology_ladder_complete_v232.py
      - name: v21.8 full Rhinology ladder hard gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: v23.1 full Head and Neck Oncology ladder hard gate
        run: python audit_hn_ladder_complete_v231.py
      - name: v24.0 full Thyroid Parathyroid Salivary ladder hard gate
        run: python audit_tps_ladder_complete_v240.py
      - name: v25.6 full Laryngology Voice Swallowing ladder hard gate
        run: python audit_laryngology_ladder_complete_v256.py
      - name: v26.7 full Sleep Surgery ladder hard gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: v20.9 Rhinology answer-pattern regression gate
        run: python audit_rhinology_v209.py
      - name: v21.1 ladder answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py
      - name: v20 OR registry inventory
        run: python audit_or_inventory_v200.py
      - name: v20.x procedure-specific OR sequence hard gate
        run: python audit_or_procedure_sequences_v200.py
      - name: v20.4-v20.9 OR preoperative physiology and safety gate
        run: python audit_or_preop_physiology_v204.py
      - name: v20.10 focused OR postoperative safety gate
        run: python audit_or_postop_safety_v210.py
      - name: v21.2-v21.9 OR decision and procedure-specific anatomy gate
        run: python audit_or_preop_decision_v212.py
      - name: v21.7 otology OR planning and postoperative management gate
        run: python audit_or_otology_management_v217.py
      - name: v21.8 laryngology/swallowing OR management gate
        run: python audit_or_laryngology_management_v218.py
      - name: v22.0-v22.1 pediatric airway OR management and anatomy gate
        run: python audit_or_pediatric_airway_v220.py
      - name: v22.2 rhinology OR procedure-specific anatomy gate
        run: python audit_or_rhinology_anatomy_v222.py
      - name: v22.3 facial trauma OR procedure-specific anatomy gate
        run: python audit_or_facial_trauma_v223.py
      - name: v22.4 reconstruction OR procedure-specific anatomy gate
        run: python audit_or_reconstruction_v224.py
      - name: v22.5 reconstruction OR planning and postoperative management gate
        run: python audit_or_reconstruction_management_v225.py
      - name: v22.6 pediatric adenotonsillar OR procedure-specific anatomy gate
        run: python audit_or_adenotonsillar_anatomy_v226.py
      - name: v22.7 tracheostomy OR procedure-specific anatomy gate
        run: python audit_or_tracheostomy_anatomy_v227.py
      - name: v22.8 sleep surgery OR procedure-specific anatomy gate
        run: python audit_or_sleep_anatomy_v228.py
      - name: v22.9 sleep surgery OR planning and postoperative management gate
        run: python audit_or_sleep_management_v229.py
      - name: v23.0 salivary OR procedure-specific anatomy gate
        run: python audit_or_salivary_anatomy_v230.py
      - name: v23.1 thyroid/parathyroid OR procedure-specific anatomy gate
        run: python audit_or_thyroid_parathyroid_anatomy_v231.py
      - name: v23.2 reoperative endocrine OR procedure-specific anatomy gate
        run: python audit_or_reoperative_endocrine_v232.py
      - name: v23.3 total laryngectomy OR planning and postoperative rescue gate
        run: python audit_or_laryngectomy_management_v233.py
      - name: v23.4 neck dissection OR planning and postoperative rescue gate
        run: python audit_or_neck_dissection_management_v234.py
      - name: v23.5 major oncologic resection OR planning and postoperative rescue gate
        run: python audit_or_major_oncologic_resection_management_v235.py
      - name: v23.6 skull base OR planning and postoperative rescue gate
        run: python audit_or_skull_base_management_v236.py
      - name: v23.7 arytenoid adduction OR anatomy and management gate
        run: python audit_or_arytenoid_adduction_v237.py
      - name: v23.8 pediatric adenotonsillar OR management gate
        run: python audit_or_adenotonsillar_management_v238.py
      - name: v23.9 septoplasty OR planning and postoperative rescue gate
        run: python audit_or_septoplasty_management_v239.py
      - name: v23.10 cochlear implant OR planning and postoperative rescue gate
        run: python audit_or_cochlear_implant_management_v2310.py
      - name: v23.11 salivary OR planning and postoperative rescue gate
        run: python audit_or_salivary_management_v2311.py
      - name: v23.12 thyroid OR planning and postoperative rescue gate
        run: python audit_or_thyroid_management_v2312.py
      - name: v23.13 parathyroid OR planning and postoperative rescue gate
        run: python audit_or_parathyroid_management_v2313.py
      - name: v19.0 OR Tomorrow structural + postoperative gate
        run: python audit_or_tomorrow_v190.py
      - name: v16.8 runtime reliability and route smoke gate
        run: python audit_reliability_v168.py
      - name: v18.0 exhaustive user-route backend gate
        run: python audit_all_user_routes_v180.py
      - name: v18.2 Pasha review backend and persistence gate
        run: python audit_pasha_review_v182.py
      - name: Canonical coverage release gate
        run: python audit_coverage_v135.py --depth --strict
      - name: Resident-level quality audit
        run: python audit_quality_v149.py
      - name: Historical learning-ladder audit
        run: python audit_learning_ladders_v154.py
      - name: Content-depth audit
        run: python audit_content_depth_v155.py
      - name: Deep Curriculum six-layer audit
        run: python audit_deep_curriculum_v159.py
      - name: Deep Curriculum duplicate architecture audit
        run: python audit_deep_curriculum_duplicates_v163.py
      - name: Concept Checks full-bank audit
        run: python audit_concept_checks_v161.py
      - name: v17.7 board-style Concept Check + Deep Curriculum audit
        run: python audit_board_curriculum_v177.py
      - name: v17.8 hard all-domain Concept Check curation gate
        run: python audit_concept_checks_all_domains_v178.py
      - name: Upload v17.8 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v178-all-domain-audit
          path: V178_ALL_DOMAIN_AUDIT.json
          if-no-files-found: warn

# Boot health and the runtime ladder contract run first so content-integrity
# failures are not masked by unrelated subsystem gates. Completed Otology,
# Rhinology, Head & Neck Oncology, Thyroid/Parathyroid/Salivary, Pediatric
# Otolaryngology, Laryngology / Voice / Swallowing, Facial Plastics / Trauma,
# and Sleep Surgery domains remain protected by domain and/or ladder quality
# gates before unrelated OR subsystems. All OR, route, coverage, Deep Curriculum,
# Concept Check, and reviewed ladder quality gates remain in force afterward.
