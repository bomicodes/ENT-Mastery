name: ENT Mastery coverage and quality audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit_coverage_v135.py'
      - 'audit_quality_v149.py'
      - 'data.py'
      - 'recognize_stage_v127.py'
      - 'new_topics_v*.py'
      - 'vignettes_v*.py'
      - '.github/workflows/coverage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Canonical coverage release gate
        run: python audit_coverage_v135.py --depth --strict
      - name: Resident-level quality audit
        run: python audit_quality_v149.py

# Canonical topic coverage is now a release gate and must stay at 100%.
# The v14.9 quality audit is deliberately informational while the first true
# chief/boards/call/OR quality pass is being reviewed. Once its flagged debt is
# closed, switch that step to `python audit_quality_v149.py --strict-quality`.
