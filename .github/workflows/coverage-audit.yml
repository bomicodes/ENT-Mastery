name: ENT Mastery coverage and quality audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preflight_boot_check_v155.py'
      - 'audit_content_depth_v155.py'
      - 'audit_learning_ladders_v154.py'
      - 'audit_deep_curriculum_v159.py'
      - 'audit_deep_curriculum_duplicates_v163.py'
      - 'audit_concept_checks_v161.py'
      - 'audit_coverage_v135.py'
      - 'audit_quality_v149.py'
      - 'audit_reliability_v168.py'
      - 'data.py'
      - 'app.py'
      - 'db.py'
      - 'wsgi.py'
      - 'runtime_entry.py'
      - 'reliability_v*.py'
      - 'clinical_hierarchy_v*.py'
      - 'deep_curriculum_canonicalize_v*.py'
      - 'recognize_stage_v127.py'
      - 'new_topics_v*.py'
      - 'vignettes_v*.py'
      - '*_depth_v*.py'
      - 'templates/**'
      - 'static/*.css'
      - 'static/*.js'
      - 'render.yaml'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/coverage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: v16.8 runtime reliability and route smoke gate
        run: python audit_reliability_v168.py
      - name: Canonical coverage release gate
        run: python audit_coverage_v135.py --depth --strict
      - name: Resident-level quality audit
        run: python audit_quality_v149.py
      - name: Learning-ladder audit
        run: python audit_learning_ladders_v154.py
      - name: Content-depth audit
        run: python audit_content_depth_v155.py
      - name: Deep Curriculum six-layer audit
        run: python audit_deep_curriculum_v159.py
      - name: Deep Curriculum duplicate architecture audit
        run: python audit_deep_curriculum_duplicates_v163.py
      - name: Concept Checks full-bank audit
        run: python audit_concept_checks_v161.py

# Boot health and runtime route integrity are hard gates. Canonical coverage remains strict.
# Duplicate architecture remains informational while explicit canonical merges are reviewed;
# CI stays read-only against production and uses an isolated SQLite database for route smoke tests.
