name: ENT Mastery coverage and quality audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preflight_boot_check_v155.py'
      - 'audit_content_depth_v155.py'
      - 'audit_learning_ladders_v154.py'
      - 'audit_deep_curriculum_v159.py'
      - 'audit_deep_curriculum_duplicates_v163.py'
      - 'audit_concept_checks_v161.py'
      - 'audit_board_curriculum_v177.py'
      - 'audit_concept_checks_all_domains_v178.py'
      - 'audit_all_user_routes_v180.py'
      - 'audit_pasha_review_v182.py'
      - 'audit_or_tomorrow_v190.py'
      - 'audit_or_inventory_v200.py'
      - 'audit_or_procedure_sequences_v200.py'
      - 'or_tomorrow_overhaul_v190.py'
      - 'or_concept_link_fix_v191.py'
      - 'or_procedure_sequences_v200.py'
      - 'or_procedure_sequences_v201.py'
      - 'concept_check_board_repair_v177.py'
      - 'concept_check_domain_curation_v178.py'
      - 'deep_curriculum_distinct_entities_v178.py'
      - 'audit_coverage_v135.py'
      - 'audit_quality_v149.py'
      - 'audit_reliability_v168.py'
      - 'data.py'
      - 'app.py'
      - 'db.py'
      - 'pasha_*.py'
      - 'runtime_entry_pasha.py'
      - 'wsgi.py'
      - 'runtime_entry.py'
      - 'reliability_v*.py'
      - 'clinical_hierarchy_v*.py'
      - 'deep_curriculum_canonicalize_v*.py'
      - 'recognize_stage_v127.py'
      - 'new_topics_v*.py'
      - 'vignettes_v*.py'
      - '*_depth_v*.py'
      - 'templates/**'
      - 'static/*.css'
      - 'static/*.js'
      - 'render.yaml'
      - 'Procfile'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/coverage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: v20 OR registry inventory
        run: python audit_or_inventory_v200.py
      - name: v16.8 runtime reliability and route smoke gate
        run: python audit_reliability_v168.py
      - name: v18.0 exhaustive user-route backend gate
        run: python audit_all_user_routes_v180.py
      - name: v18.2 Pasha review backend and persistence gate
        run: python audit_pasha_review_v182.py
      - name: v19.0 OR Tomorrow operative + postoperative depth gate
        run: python audit_or_tomorrow_v190.py
      - name: v20.0 procedure-specific OR sequence hard gate
        run: python audit_or_procedure_sequences_v200.py
      - name: Canonical coverage release gate
        run: python audit_coverage_v135.py --depth --strict
      - name: Resident-level quality audit
        run: python audit_quality_v149.py
      - name: Learning-ladder audit
        run: python audit_learning_ladders_v154.py
      - name: Content-depth audit
        run: python audit_content_depth_v155.py
      - name: Deep Curriculum six-layer audit
        run: python audit_deep_curriculum_v159.py
      - name: Deep Curriculum duplicate architecture audit
        run: python audit_deep_curriculum_duplicates_v163.py
      - name: Concept Checks full-bank audit
        run: python audit_concept_checks_v161.py
      - name: v17.7 board-style Concept Check + Deep Curriculum audit
        run: python audit_board_curriculum_v177.py
      - name: v17.8 hard all-domain Concept Check curation gate
        run: python audit_concept_checks_all_domains_v178.py
      - name: Upload v17.8 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v178-all-domain-audit
          path: V178_ALL_DOMAIN_AUDIT.json
          if-no-files-found: warn

# Boot health, exhaustive navigation integrity, Pasha review, OR Tomorrow depth,
# procedure-specific OR choreography, canonical coverage, and the v17.8 Concept
# Check contract are hard gates. CI uses an isolated SQLite database and does not
# mutate production state.
