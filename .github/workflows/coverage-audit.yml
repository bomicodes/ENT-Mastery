name: ENT Mastery coverage and quality audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preflight_boot_check_v155.py'
      - 'audit_content_depth_v155.py'
      - 'audit_learning_ladders_v154.py'
      - 'audit_coverage_v135.py'
      - 'audit_quality_v149.py'
      - 'data.py'
      - 'recognize_stage_v127.py'
      - 'runtime_entry.py'
      - 'new_topics_v*.py'
      - 'vignettes_v*.py'
      - '.github/workflows/coverage-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Canonical coverage release gate
        run: python audit_coverage_v135.py --depth --strict
      - name: Resident-level quality audit
        run: python audit_quality_v149.py
      - name: Learning-ladder audit
        run: python audit_learning_ladders_v154.py
      - name: Content-depth audit
        run: python audit_content_depth_v155.py

# Boot health is the first hard gate: if runtime_entry cannot import or the
# homepage cannot render 200, stop immediately and do not trust later audits.
# Canonical topic coverage remains a strict release gate at 100%.
# The v14.9/v15.4/v15.5 content-quality audits remain informational while the
# foundation -> application -> senior-decision curation pass is still active.
