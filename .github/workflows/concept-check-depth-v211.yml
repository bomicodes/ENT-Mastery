name: Concept Check depth v20.11

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'concept_check_depth_v211.py'
      - 'concept_check_final_clinical_gate_v179.py'
      - 'concept_check_local_flap_reconstruction_v211.py'
      - 'concept_check_cervicofacial_flap_v211.py'
      - 'concept_check_forehead_flap_v211.py'
      - 'audit_concept_check_task_alignment_v211.py'
      - 'audit_concept_check_depth_backlog_v211.py'
      - 'audit_concept_check_teaching_alignment_v206.py'
      - '.github/workflows/concept-check-depth-v211.yml'
  push:
    branches: [main]
    paths:
      - 'concept_check_depth_v211.py'
      - 'concept_check_final_clinical_gate_v179.py'
      - 'concept_check_local_flap_reconstruction_v211.py'
      - 'concept_check_cervicofacial_flap_v211.py'
      - 'concept_check_forehead_flap_v211.py'
      - 'audit_concept_check_task_alignment_v211.py'
      - 'audit_concept_check_depth_backlog_v211.py'
      - 'audit_concept_check_teaching_alignment_v206.py'
      - '.github/workflows/concept-check-depth-v211.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Strict 325-topic canonical coverage
        run: python audit_coverage_v135.py --depth --strict
      - name: All-domain Concept Check curation
        run: python audit_concept_checks_all_domains_v178.py
      - name: Prior validated v20.10 Peritonsillar Abscess task-answer/source gate
        run: python audit_concept_check_task_alignment_v210.py
      - name: Prior validated v20.10 live-canonical depth backlog
        run: python audit_concept_check_depth_backlog_v210.py
      - name: v20.11 Facial Soft-Tissue Lacerations / Burns task-answer/source gate
        run: python audit_concept_check_task_alignment_v211.py
      - name: v20.11 live-canonical depth backlog
        run: python audit_concept_check_depth_backlog_v211.py
      - name: Full-bank teaching-alignment regression
        run: python audit_concept_check_teaching_alignment_v206.py
      - name: Facial Plastics completed-domain gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Facial trauma deep semantic-boundary gate
        run: python audit_facial_deep_semantic_boundaries_v302.py
      - name: Facial graft selection and rescue semantic gate
        run: python audit_facial_graft_rescue_semantic_v342.py
      - name: Skin graft vascularity semantic gate
        run: python audit_facial_graft_vascular_semantics_v343.py
      - name: Forehead-flap vascular compromise rescue gate
        run: python audit_facial_forehead_flap_rescue_v345.py
      - name: Eyelid orbital-compartment rescue gate
        run: python audit_facial_eyelid_ocs_rescue_v346.py
      - name: Facelift expanding-hematoma rescue gate
        run: python audit_facial_facelift_hematoma_rescue_v347.py
      - name: Upload v20.11 backlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v211-depth-backlog-audit
          path: V211_DEPTH_BACKLOG_AUDIT.json
          if-no-files-found: warn
      - name: Upload teaching-alignment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v211-teaching-alignment-audit
          path: V206_CONCEPT_CHECK_TEACHING_ALIGNMENT_AUDIT.json
          if-no-files-found: warn
