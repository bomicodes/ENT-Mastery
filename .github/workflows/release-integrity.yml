jobs:
  release-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Fail-closed global release manifest
        run: python audit_global_release_integrity_v310.py
      - name: Strict 325-topic canonical coverage contract
        run: python audit_coverage_v135.py --depth --strict
      - name: Full Rhinology ladder hard gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Full Otology ladder hard gate
        run: python audit_otology_ladder_complete_v232.py
      - name: Full Head and Neck Oncology ladder hard gate
        run: python audit_hn_ladder_complete_v231.py
      - name: Full Thyroid Parathyroid Salivary ladder hard gate
        run: python audit_tps_ladder_complete_v240.py
      - name: Full Pediatric Otolaryngology ladder hard gate
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Full Laryngology Voice Swallowing ladder hard gate
        run: python audit_laryngology_ladder_complete_v256.py
      - name: Full Facial Plastics Trauma ladder hard gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Full Sleep Surgery ladder hard gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: Full General ENT Emergencies ladder hard gate
        run: python audit_general_ent_complete_v274.py
      - name: Pediatric ear semantic distinction gate
        run: python audit_pediatric_ear_semantic_v289.py
      - name: Head and Neck salvage ladder distinction gate
        run: python audit_hn_salvage_ladder_distinction_v288.py
      - name: Neck dissection versus complications semantic gate
        run: python audit_hn_neck_semantic_v294.py
      - name: Frontal sinus management semantic gate
        run: python audit_facial_frontal_sinus_management_v295.py
      - name: NOE management semantic gate
        run: python audit_facial_noe_management_v298.py
      - name: Allergic rhinitis versus local allergic rhinitis semantic gate
        run: python audit_rhinology_rhinitis_semantic_v297.py
      - name: Pediatric PSG management semantic gate
        run: python audit_sleep_peds_psg_management_v299.py
      - name: Facial trauma deep semantic-boundary gate
        run: python audit_facial_deep_semantic_boundaries_v302.py
      - name: Supraglottic versus glottic semantic gate
        run: python audit_hn_larynx_site_semantic_v306.py
      - name: Oral tongue versus base-of-tongue semantic gate
        run: python audit_hn_tongue_site_semantic_v307.py
      - name: Cross-domain late-radiation aspiration semantic gate
        run: python audit_cross_domain_aspiration_semantic_v308.py
      - name: Cutaneous SCC versus BCC semantic gate
        run: python audit_hn_cutaneous_site_semantic_v309.py
      - name: Head and Neck phenotype-specific source-saturation gate
        run: python audit_hn_source_saturation_v348.py
      - name: Facial graft selection and rescue semantic gate
        run: python audit_facial_graft_rescue_semantic_v342.py
      - name: Skin graft vascularity semantic gate
        run: python audit_facial_graft_vascular_semantics_v343.py
      - name: Forehead-flap vascular compromise rescue gate
        run: python audit_facial_forehead_flap_rescue_v345.py
      - name: Eyelid orbital-compartment rescue gate
        run: python audit_facial_eyelid_ocs_rescue_v346.py
      - name: Facelift expanding-hematoma rescue gate
        run: python audit_facial_facelift_hematoma_rescue_v347.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Prior validated Concept Check task-answer alignment v20.6
        run: python audit_concept_check_task_alignment_v206.py
      - name: Prior validated live-canonical Concept Check depth backlog v20.6
        run: python audit_concept_check_depth_backlog_v206.py
      - name: Prior validated Concept Check task-answer alignment v20.7
        run: python audit_concept_check_task_alignment_v207.py
      - name: Prior validated live-canonical Concept Check depth backlog v20.7
        run: python audit_concept_check_depth_backlog_v207.py
      - name: Prior validated Concept Check task-answer alignment v20.8
        run: python audit_concept_check_task_alignment_v208.py
      - name: Prior validated live-canonical Concept Check depth backlog v20.8
        run: python audit_concept_check_depth_backlog_v208.py
      - name: Current Concept Check task-answer alignment v20.9
        run: python audit_concept_check_task_alignment_v209.py
      - name: Current live-canonical Concept Check depth backlog v20.9
        run: python audit_concept_check_depth_backlog_v209.py
      - name: Current adversarial OR danger-zone and rescue gate
        run: python audit_or_rescue_v268.py
      - name: Current OR commitment and bailout gate
        run: python audit_or_commitment_v269.py
      - name: Current free-flap reconstruction bailout gate
        run: python audit_or_reconstruction_bailouts_v270.py
      - name: Current shared-airway exposure and ventilation bailout gate
        run: python audit_or_airway_bailouts_v271.py
      - name: Current neck-dissection chyle rescue gate
        run: python audit_or_neck_dissection_rescue_v272.py
      - name: Current neck-dissection venous-outflow rescue gate
        run: python audit_or_neck_dissection_venous_outflow_v273.py
      - name: Current neck-dissection carotid-danger rescue gate
        run: python audit_or_neck_dissection_carotid_danger_v274.py
      - name: Current neck-dissection aerodigestive-rescue gate
        run: python audit_or_neck_dissection_aerodigestive_rescue_v275.py
      - name: Current neck-dissection venous-air-embolism rescue gate
        run: python audit_or_neck_dissection_air_embolism_rescue_v276.py
      - name: Current neck-dissection accessory-nerve rescue gate
        run: python audit_or_neck_dissection_accessory_nerve_rescue_v277.py
      - name: Current neck-dissection critical-nerve rescue gate
        run: python audit_or_neck_dissection_critical_nerve_rescue_v278.py
      - name: Current neck-dissection deep-plane rescue gate
        run: python audit_or_neck_dissection_deep_plane_rescue_v279.py
      - name: Current parotid facial-nerve commitment and rescue gate
        run: python audit_or_parotid_facial_nerve_rescue_v280.py
      - name: Current cochlear-implant malformed-ear rescue gate
        run: python audit_deep_cochlear_implant_rescue_v339.py
      - name: Current post-tonsillectomy hemorrhage rescue gate
        run: python audit_or_tonsil_hemorrhage_rescue_v281.py
      - name: Current post-thyroidectomy hematoma rescue gate
        run: python audit_or_thyroid_hematoma_rescue_v282.py
      - name: Current tracheostomy hemorrhage/TIF rescue gate
        run: python audit_or_tracheostomy_hemorrhage_rescue_v283.py
      - name: Current post-septoplasty septal hematoma/abscess rescue gate
        run: python audit_or_septal_hematoma_rescue_v284.py
      - name: Current post-esophagoscopy esophageal-perforation rescue gate
        run: python audit_or_esophageal_perforation_rescue_v285.py
      - name: Current post-laryngectomy pharyngocutaneous-fistula rescue gate
        run: python audit_or_laryngectomy_fistula_rescue_v287.py
      - name: Current shared-airway fire rescue gate
