name: Rhinology rhinitis semantic v29.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rhinology_rhinitis_semantic_alignment_v297.py'
      - 'audit_rhinology_rhinitis_semantic_v297.py'
      - 'vignette_ladders_v212.py'
      - 'deep_curriculum_rhinology_v285.py'
      - 'ladder_answer_balance_v211.py'
      - 'runtime_entry.py'
      - '.github/workflows/rhinology-rhinitis-semantic-v297.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Runtime learning-ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Rhinology canonical hard gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Allergic versus local allergic rhinitis semantic gate
        run: python audit_rhinology_rhinitis_semantic_v297.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
