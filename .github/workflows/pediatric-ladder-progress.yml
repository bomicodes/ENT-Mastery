name: Pediatric ladder complete gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit_pediatric_ladder_complete_v248.py'
      - 'audit_pediatric_remaining_v247.py'
      - 'vignette_ladders_v*.py'
      - 'runtime_entry.py'
      - 'data.py'
      - 'ladder_answer_balance_v*.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'deep_curriculum_canonicalize_v*.py'
      - 'clinical_hierarchy_v*.py'

jobs:
  pediatric-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime learning-ladder gate
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact Pediatric canonical inventory
        run: python audit_pediatric_remaining_v247.py
      - name: Pediatric 40-topic full-domain hard gate
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Ladder answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py
