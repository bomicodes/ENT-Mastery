name: CI - Facial Plastics Ladder Progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vignette_ladders_v257.py'
      - 'vignette_ladders_v258.py'
      - 'vignette_ladders_v259.py'
      - 'vignette_ladders_v260.py'
      - 'vignette_ladders_v261.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_facial_plastics_ladder_progress_v261.py'
      - 'audit_learning_ladders_runtime_v204.py'
      - 'audit_domain_ladder_inventory_v217.py'
      - 'runtime_entry.py'
      - '.github/workflows/facial-plastics-ladder-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: v26.1 Facial Plastics 25-topic progress hard gate
        run: python audit_facial_plastics_ladder_progress_v261.py
      - name: Answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py

# This workflow protects deliberate-review progress while Facial Plastics / Trauma
# is being completed. It must grow with each canonical batch and eventually be
# replaced by a full-domain completion gate.
