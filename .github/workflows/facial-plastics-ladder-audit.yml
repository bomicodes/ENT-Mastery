name: CI - Facial Plastics Full Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vignette_ladders_v257.py'
      - 'vignette_ladders_v258.py'
      - 'vignette_ladders_v259.py'
      - 'vignette_ladders_v260.py'
      - 'vignette_ladders_v261.py'
      - 'vignette_ladders_v262.py'
      - 'facial_frontal_sinus_management_v295.py'
      - 'hn_neck_semantic_alignment_v294.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_facial_plastics_full_domain_v262.py'
      - 'audit_facial_frontal_sinus_management_v295.py'
      - 'audit_learning_ladders_runtime_v204.py'
      - 'audit_domain_ladder_inventory_v217.py'
      - 'runtime_entry.py'
      - '.github/workflows/facial-plastics-ladder-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: v26.2 Facial Plastics 32-topic full-domain hard gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: v29.5 Frontal sinus outflow management hard gate
        run: python audit_facial_frontal_sinus_management_v295.py
      - name: Answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py

# Completed-domain hard gate: all 32 exact Facial Plastics / Trauma canonical
# topics must retain reviewed foundation/application/senior-decision ladders.
# v29.5 additionally protects the distinct frontal-sinus outflow-tract management
# axis while preserving the original observation and skull-base escalation cases.
# Cross-domain semantic modules imported by ladder_answer_balance are watched here
# because they can alter live rationale alignment before this domain gate executes.
