name: OR Tomorrow semantic integrity v26.6

on:
  push:
    branches: [main]
    paths:
      - 'runtime_entry.py'
      - 'or_*.py'
      - 'audit_or_semantic_integrity_v266.py'
      - '.github/workflows/or-semantic-integrity-v266.yml'
  workflow_dispatch:

jobs:
  semantic-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Adversarial OR semantic-integrity gate
        run: python audit_or_semantic_integrity_v266.py
