name: ENT Mastery Concept Check curation release bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'concept_check_domain_curation_v178.py'
      - 'audit_concept_checks_all_domains_v178.py'
      - '.github/workflows/concept-check-curation-release-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'concept_check_domain_curation_v178.py'
      - 'audit_concept_checks_all_domains_v178.py'
      - '.github/workflows/concept-check-curation-release-bridge.yml'

jobs:
  fail-closed-curation-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: All-domain Concept Check curation gate
        run: python audit_concept_checks_all_domains_v178.py
      - name: Fail-closed global release manifest
        run: python audit_global_release_integrity_v310.py
      - name: Strict 325-topic canonical coverage contract
        run: python audit_coverage_v135.py --depth --strict
      - name: Nine completed-domain hard gates
        run: |
          python audit_rhinology_ladder_complete_v218.py
          python audit_otology_ladder_complete_v232.py
          python audit_hn_ladder_complete_v231.py
          python audit_tps_ladder_complete_v240.py
          python audit_pediatric_ladder_complete_v248.py
          python audit_laryngology_ladder_complete_v256.py
          python audit_facial_plastics_full_domain_v262.py
          python audit_sleep_surgery_progress_v266.py
          python audit_general_ent_complete_v274.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Current Concept Check alignment and live backlog
        run: |
          python audit_concept_check_task_alignment_v206.py
          python audit_concept_check_depth_backlog_v206.py
      - name: Current OR danger-zone commitment and bailout family
        run: |
          python audit_or_rescue_v268.py
          python audit_or_commitment_v269.py
          python audit_or_reconstruction_bailouts_v270.py
          python audit_or_airway_bailouts_v271.py
          python audit_or_neck_dissection_rescue_v272.py
          python audit_or_neck_dissection_venous_outflow_v273.py
          python audit_or_neck_dissection_carotid_danger_v274.py
          python audit_or_neck_dissection_aerodigestive_rescue_v275.py
          python audit_or_neck_dissection_air_embolism_rescue_v276.py
          python audit_or_neck_dissection_accessory_nerve_rescue_v277.py
          python audit_or_neck_dissection_critical_nerve_rescue_v278.py
          python audit_or_neck_dissection_deep_plane_rescue_v279.py
          python audit_or_parotid_facial_nerve_rescue_v280.py
      - name: Current procedure-specific rescue tail
        run: |
          python audit_deep_cochlear_implant_rescue_v339.py
          python audit_facial_graft_rescue_semantic_v342.py
          python audit_facial_graft_vascular_semantics_v343.py
          python audit_facial_forehead_flap_rescue_v345.py
          python audit_facial_eyelid_ocs_rescue_v346.py
          python audit_facial_facelift_hematoma_rescue_v347.py
          python audit_hn_source_saturation_v348.py
          python audit_or_tonsil_hemorrhage_rescue_v281.py
          python audit_or_thyroid_hematoma_rescue_v282.py
          python audit_or_tracheostomy_hemorrhage_rescue_v283.py
          python audit_or_septal_hematoma_rescue_v284.py
          python audit_or_esophageal_perforation_rescue_v285.py
          python audit_or_laryngectomy_fistula_rescue_v287.py
          python audit_or_airway_fire_rescue_v288.py
          python audit_or_posterior_epistaxis_rescue_v289.py
          python audit_or_tep_prosthesis_rescue_v290.py
          python audit_or_zenker_perforation_rescue_v291.py
          python audit_or_airway_dilation_injury_rescue_v292.py

# This bridge intentionally duplicates the controlling release contract for the
# Concept Check curation layer. A curation/generator change must not be able to
# alter hundreds of live questions while escaping the 325-topic, nine-domain,
# answer-balance, current Concept Check, or current OR rescue gates.
