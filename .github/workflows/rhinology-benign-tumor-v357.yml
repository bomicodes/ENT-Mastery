name: Rhinology benign sinonasal tumor v35.7

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deep_curriculum_rhinology_v357.py'
      - 'audit_rhinology_benign_tumor_v357.py'
      - 'deep_curriculum_rhinology_v356.py'
      - 'audit_rhinology_exact_odontogenic_unilateral_v356.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'runtime_entry_pasha.py'
      - 'data.py'
      - 'audit_concept_check_depth_backlog_v223.py'
      - 'audit_concept_check_teaching_alignment_v206.py'
      - '.github/workflows/rhinology-benign-tumor-v357.yml'
      - '.github/workflows/release-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'deep_curriculum_rhinology_v357.py'
      - 'audit_rhinology_benign_tumor_v357.py'
      - 'deep_curriculum_rhinology_v356.py'
      - 'audit_rhinology_exact_odontogenic_unilateral_v356.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'runtime_entry_pasha.py'
      - 'data.py'
      - 'audit_concept_check_depth_backlog_v223.py'
      - 'audit_concept_check_teaching_alignment_v206.py'
      - '.github/workflows/rhinology-benign-tumor-v357.yml'
      - '.github/workflows/release-integrity.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Strict 325-topic canonical coverage
        run: python audit_coverage_v135.py --depth --strict
      - name: v35.6 exact unilateral/odontogenic predecessor gate
        run: python audit_rhinology_exact_odontogenic_unilateral_v356.py
      - name: v35.7 exact benign sinonasal tumor gate
        run: python audit_rhinology_benign_tumor_v357.py
      - name: Live Concept Check depth backlog preservation
        run: python audit_concept_check_depth_backlog_v223.py
      - name: Full-bank Concept Check teaching alignment
        run: python audit_concept_check_teaching_alignment_v206.py
      - name: All-domain Concept Check curation
        run: python audit_concept_checks_all_domains_v178.py
      - name: Rhinology completed-domain gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Otology completed-domain gate
        run: python audit_otology_ladder_complete_v232.py
      - name: Head and Neck Oncology completed-domain gate
        run: python audit_hn_ladder_complete_v231.py
      - name: Thyroid Parathyroid Salivary completed-domain gate
        run: python audit_tps_ladder_complete_v240.py
      - name: Pediatric Otolaryngology completed-domain gate
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Laryngology Voice Swallowing completed-domain gate
        run: python audit_laryngology_ladder_complete_v256.py
      - name: Facial Plastics Trauma completed-domain gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Sleep Surgery completed-domain gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: General ENT Emergencies completed-domain gate
        run: python audit_general_ent_complete_v274.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Current OR danger-zone and rescue gate
        run: python audit_or_rescue_v268.py
      - name: Current OR commitment and bailout gate
        run: python audit_or_commitment_v269.py
      - name: Current free-flap reconstruction bailout gate
        run: python audit_or_reconstruction_bailouts_v270.py
      - name: Current shared-airway exposure and ventilation bailout gate
        run: python audit_or_airway_bailouts_v271.py
      - name: Current neck-dissection chyle rescue gate
        run: python audit_or_neck_dissection_rescue_v272.py
      - name: Current neck-dissection venous-outflow rescue gate
        run: python audit_or_neck_dissection_venous_outflow_v273.py
      - name: Current neck-dissection carotid-danger rescue gate
        run: python audit_or_neck_dissection_carotid_danger_v274.py
      - name: Current neck-dissection aerodigestive-rescue gate
        run: python audit_or_neck_dissection_aerodigestive_rescue_v275.py
      - name: Current neck-dissection venous-air-embolism rescue gate
        run: python audit_or_neck_dissection_air_embolism_rescue_v276.py
      - name: Current neck-dissection accessory-nerve rescue gate
        run: python audit_or_neck_dissection_accessory_nerve_rescue_v277.py
      - name: Current neck-dissection critical-nerve rescue gate
        run: python audit_or_neck_dissection_critical_nerve_rescue_v278.py
      - name: Current neck-dissection deep-plane rescue gate
        run: python audit_or_neck_dissection_deep_plane_rescue_v279.py
      - name: Current parotid facial-nerve commitment and rescue gate
        run: python audit_or_parotid_facial_nerve_rescue_v280.py
      - name: Current cochlear-implant malformed-ear rescue gate
        run: python audit_deep_cochlear_implant_rescue_v339.py
      - name: Current post-tonsillectomy hemorrhage rescue gate
        run: python audit_or_tonsil_hemorrhage_rescue_v281.py
      - name: Current post-thyroidectomy hematoma rescue gate
        run: python audit_or_thyroid_hematoma_rescue_v282.py
      - name: Current tracheostomy hemorrhage/TIF rescue gate
        run: python audit_or_tracheostomy_hemorrhage_rescue_v283.py
      - name: Current post-septoplasty septal hematoma/abscess rescue gate
        run: python audit_or_septal_hematoma_rescue_v284.py
      - name: Current post-esophagoscopy esophageal-perforation rescue gate
        run: python audit_or_esophageal_perforation_rescue_v285.py
      - name: Current post-laryngectomy pharyngocutaneous-fistula rescue gate
        run: python audit_or_laryngectomy_fistula_rescue_v287.py
      - name: Current shared-airway fire rescue gate
        run: python audit_or_airway_fire_rescue_v288.py
      - name: Current posterior-epistaxis/SPA rescue gate
        run: python audit_or_posterior_epistaxis_rescue_v289.py
      - name: Current TEP prosthesis displacement/aspiration rescue gate
        run: python audit_or_tep_prosthesis_rescue_v290.py
