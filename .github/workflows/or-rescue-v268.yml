name: OR Tomorrow rescue v26.8

on:
  push:
    branches: [main]
    paths:
      - 'audit_or_rescue_v268.py'
      - 'or_*.py'
      - 'runtime_entry.py'
      - 'app.py'
      - '.github/workflows/or-rescue-v268.yml'
  workflow_dispatch:

jobs:
  rescue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Adversarial OR rescue gate
        run: python audit_or_rescue_v268.py
