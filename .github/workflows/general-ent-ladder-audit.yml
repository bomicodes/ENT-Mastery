name: General ENT ladder audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vignette_ladders_v269.py'
      - 'vignette_ladders_v270.py'
      - 'vignette_ladders_v270_fix.py'
      - 'vignette_ladders_v271.py'
      - 'vignette_ladders_v272.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_general_ent_progress_v269.py'
      - 'audit_general_ent_progress_v270.py'
      - 'audit_general_ent_progress_v271.py'
      - 'audit_general_ent_progress_v272.py'
      - 'audit_learning_ladders_runtime_v204.py'
      - 'audit_domain_ladder_inventory_v217.py'
      - 'data.py'
      - 'runtime_entry.py'
      - '.github/workflows/general-ent-ladder-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Runtime learning-ladder hard gate
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: Preserve Otology full-domain hard gate
        run: python audit_otology_ladder_complete_v232.py
      - name: Preserve Rhinology full-domain hard gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Preserve Head and Neck Oncology full-domain hard gate
        run: python audit_hn_ladder_complete_v231.py
      - name: Preserve Thyroid Parathyroid Salivary full-domain hard gate
        run: python audit_tps_ladder_complete_v240.py
      - name: Preserve Pediatric Otolaryngology full-domain hard gate
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Preserve Laryngology full-domain hard gate
        run: python audit_laryngology_ladder_complete_v256.py
      - name: Preserve Facial Plastics full-domain hard gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Preserve Sleep Surgery full-domain hard gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: General ENT pass 1 hard gate
        run: python audit_general_ent_progress_v269.py
      - name: General ENT 10-topic hard gate
        run: python audit_general_ent_progress_v270.py
      - name: General ENT 15-topic hard gate
        run: python audit_general_ent_progress_v271.py
      - name: General ENT 20-topic hard gate
        run: python audit_general_ent_progress_v272.py
      - name: Answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py

# General ENT progress is accepted only after the live canonical inventory and
# every completed-domain hard gate remain green. The v27.2 gate is a strict
# superset of v27.1 and preserves exact canonical links plus complete ladders.
