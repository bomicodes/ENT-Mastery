name: Sleep Pediatric PSG v29.9

on:
  push:
    branches: [main]
    paths:
      - 'sleep_peds_psg_management_v299.py'
      - 'audit_sleep_peds_psg_management_v299.py'
      - 'vignette_ladders_v266.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_sleep_surgery_progress_v266.py'
      - 'runtime_entry.py'
      - 'data.py'
      - '.github/workflows/sleep-peds-psg-v299.yml'
  workflow_dispatch:

jobs:
  pediatric-psg-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_runtime_ladder_integrity_v175.py
      - name: Full Sleep Surgery canonical ladder gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: Pediatric PSG perioperative semantic gate
        run: python audit_sleep_peds_psg_management_v299.py
      - name: Reviewed ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
