name: OR v23.21 specialty management

on:
  push:
    branches: [main]
    paths:
      - 'or_specialty_management_v2321.py'
      - 'or_general_emergency_management_v2320.py'
      - 'audit_or_specialty_management_v2321.py'
      - 'runtime_entry.py'
      - '.github/workflows/or-v2321-specialty-management.yml'
  pull_request:
    paths:
      - 'or_specialty_management_v2321.py'
      - 'or_general_emergency_management_v2320.py'
      - 'audit_or_specialty_management_v2321.py'
      - 'runtime_entry.py'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: OR v23.21 runtime and route gate
        run: python audit_or_specialty_management_v2321.py
