name: Concept Check depth v18.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'concept_check_task_alignment_v180.py'
      - 'concept_check_task_alignment_v181.py'
      - 'concept_check_task_alignment_v182.py'
      - 'concept_check_task_alignment_v183.py'
      - 'concept_check_task_alignment_v183_runtime.py'
      - 'concept_check_depth_v180.py'
      - 'concept_check_depth_v181.py'
      - 'concept_check_depth_v182.py'
      - 'concept_check_depth_v183.py'
      - 'concept_check_final_clinical_gate_v179.py'
      - 'audit_concept_check_task_alignment_v180.py'
      - 'audit_concept_check_task_alignment_v181.py'
      - 'audit_concept_check_task_alignment_v182.py'
      - 'audit_concept_check_task_alignment_v183.py'
      - 'audit_concept_check_depth_backlog_v183.py'
      - '.github/workflows/concept-check-depth-v180.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Canonical inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: Protect Otology
        run: python audit_otology_ladder_complete_v232.py
      - name: Protect Rhinology
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Protect Head and Neck Oncology
        run: python audit_hn_ladder_complete_v231.py
      - name: Protect Thyroid Parathyroid Salivary
        run: python audit_tps_ladder_complete_v240.py
      - name: Protect Pediatric Otolaryngology
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Protect Laryngology
        run: python audit_laryngology_ladder_complete_v256.py
      - name: Protect Facial Plastics
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Protect Sleep Surgery
        run: python audit_sleep_surgery_progress_v266.py
      - name: Protect General ENT
        run: python audit_general_ent_complete_v274.py
      - name: Answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: All-domain Concept Check integrity
        run: python audit_concept_checks_all_domains_v178.py
      - name: v18.0 task-answer alignment gate
        run: python audit_concept_check_task_alignment_v180.py
      - name: v18.1 task-answer alignment gate
        run: python audit_concept_check_task_alignment_v181.py
      - name: v18.2 task-answer alignment gate
        run: python audit_concept_check_task_alignment_v182.py
      - name: v18.3 task-answer alignment gate
        run: python audit_concept_check_task_alignment_v183.py
      - name: v18.3 live-canonical depth backlog gate
        run: python audit_concept_check_depth_backlog_v183.py
      - name: Upload v18.0 task-alignment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v180-task-alignment-audit
          path: V180_TASK_ALIGNMENT_AUDIT.json
          if-no-files-found: warn
      - name: Upload v18.1 task-alignment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v181-task-alignment-audit
          path: V181_TASK_ALIGNMENT_AUDIT.json
          if-no-files-found: warn
      - name: Upload v18.2 task-alignment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v182-task-alignment-audit
          path: V182_TASK_ALIGNMENT_AUDIT.json
          if-no-files-found: warn
      - name: Upload v18.3 task-alignment audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v183-task-alignment-audit
          path: V183_TASK_ALIGNMENT_AUDIT.json
          if-no-files-found: warn
      - name: Upload v18.3 live-canonical depth backlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v183-depth-backlog-audit
          path: V183_DEPTH_BACKLOG_AUDIT.json
          if-no-files-found: warn
