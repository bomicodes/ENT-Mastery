name: Audit ENT Mastery vignette coverage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_vignette_coverage_v135.py'
      - '.github/workflows/vignette-coverage-v135.yml'
      - 'recognize_stage_v127.py'
      - 'topic_alias_v129.py'
      - 'new_topics_v*.py'
      - 'vignettes_v*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile patch modules
        run: python -m py_compile data.py app.py wsgi.py recognize_stage_v127.py topic_alias_v129.py new_topics_v131.py vignettes_v132.py new_topics_v133.py vignettes_v134.py vignettes_v135.py scripts/audit_vignette_coverage_v135.py
      - name: Audit canonical vignette coverage
        run: |
          set +e
          python scripts/audit_vignette_coverage_v135.py > COVERAGE_REPORT_V135.txt 2>&1
          status=$?
          echo "AUDIT_EXIT_STATUS|$status" >> COVERAGE_REPORT_V135.txt
          cat COVERAGE_REPORT_V135.txt
          exit 0
      - name: Persist coverage report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COVERAGE_REPORT_V135.txt
          if git diff --cached --quiet; then
            echo 'coverage report unchanged'
            exit 0
          fi
          git commit -m 'Update canonical vignette coverage report'
          git push origin main
