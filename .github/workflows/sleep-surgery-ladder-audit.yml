name: CI - Sleep Surgery Ladder Progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vignette_ladders_v263.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_sleep_surgery_progress_v263.py'
      - 'audit_learning_ladders_runtime_v204.py'
      - 'audit_domain_ladder_inventory_v217.py'
      - 'runtime_entry.py'
      - '.github/workflows/sleep-surgery-ladder-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: v26.3 Sleep Surgery 5-topic hard gate
        run: python audit_sleep_surgery_progress_v263.py
      - name: Answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py

# Progress hard gate: these exact Sleep Surgery canonical topics must retain
# reviewed foundation/application/senior-decision ladders while later batches
# extend the domain toward full completion.
