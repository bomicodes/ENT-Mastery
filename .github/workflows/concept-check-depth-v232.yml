name: Concept Check depth v20.32

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'concept_check_depth_v232.py'
      - 'concept_check_final_clinical_gate_v179.py'
      - 'audit_concept_check_task_alignment_v232.py'
      - 'audit_concept_check_depth_backlog_v232.py'
      - 'deep_curriculum_peds_v367.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'audit_pediatric_cleft_learner_experience_v367.py'
      - 'audit_learner_experience_current.py'
      - 'audit_global_release_integrity_v311.py'
      - 'templates/daily_adaptive.html'
      - 'templates/concept_check.html'
      - '.github/workflows/concept-check-depth-v232.yml'
      - '.github/workflows/release-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'concept_check_depth_v232.py'
      - 'concept_check_final_clinical_gate_v179.py'
      - 'audit_concept_check_task_alignment_v232.py'
      - 'audit_concept_check_depth_backlog_v232.py'
      - 'deep_curriculum_peds_v367.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'audit_pediatric_cleft_learner_experience_v367.py'
      - 'audit_learner_experience_current.py'
      - 'audit_global_release_integrity_v311.py'
      - 'templates/daily_adaptive.html'
      - 'templates/concept_check.html'
      - '.github/workflows/concept-check-depth-v232.yml'
      - '.github/workflows/release-integrity.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Strict 325-topic canonical coverage
        run: python audit_coverage_v135.py --depth --strict
      - name: v20.32 cleft craniofacial task/source gate
        run: python audit_concept_check_task_alignment_v232.py
      - name: v36.7 cleft Deep Curriculum learner-experience gate
        run: python audit_pediatric_cleft_learner_experience_v367.py
      - name: Learner-experience discoverability gate
        shell: bash
        run: |
          set -o pipefail
          python audit_learner_experience_current.py | tee LEARNER_EXPERIENCE_AUDIT.txt
      - name: Upload learner-experience diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v232-learner-experience-audit
          path: LEARNER_EXPERIENCE_AUDIT.txt
          if-no-files-found: error
      - name: All-domain Concept Check curation
        run: python audit_concept_checks_all_domains_v178.py
      - name: Prior validated v20.30 task/source gate
        run: python audit_concept_check_task_alignment_v230.py
      - name: v20.32 live-canonical depth backlog
        run: python audit_concept_check_depth_backlog_v232.py
      - name: Full-bank teaching-alignment regression
        run: python audit_concept_check_teaching_alignment_v206.py
      - name: Rhinology completed-domain gate
        run: python audit_rhinology_ladder_complete_v218.py
      - name: Otology completed-domain gate
        run: python audit_otology_ladder_complete_v232.py
      - name: Head and Neck Oncology completed-domain gate
        run: python audit_hn_ladder_complete_v231.py
      - name: Thyroid Parathyroid Salivary completed-domain gate
        run: python audit_tps_ladder_complete_v240.py
      - name: Pediatric Otolaryngology completed-domain gate
        run: python audit_pediatric_ladder_complete_v248.py
      - name: Laryngology Voice Swallowing completed-domain gate
        run: python audit_laryngology_ladder_complete_v256.py
      - name: Facial Plastics Trauma completed-domain gate
        run: python audit_facial_plastics_full_domain_v262.py
      - name: Sleep Surgery completed-domain gate
        run: python audit_sleep_surgery_progress_v266.py
      - name: General ENT / Emergencies completed-domain gate
        run: python audit_general_ent_complete_v274.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Current OR danger-zone and rescue gate
        run: python audit_or_rescue_v268.py
      - name: Current OR commitment and bailout gate
        run: python audit_or_commitment_v269.py
      - name: Global fail-closed release integrity
        run: python audit_global_release_integrity_v311.py
      - name: Upload v20.32 backlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v232-depth-backlog-audit
          path: V232_DEPTH_BACKLOG_AUDIT.json
          if-no-files-found: warn