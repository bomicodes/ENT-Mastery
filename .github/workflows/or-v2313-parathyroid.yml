name: OR v23.13 parathyroid management

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'or_parathyroid_management_v2313.py'
      - 'or_thyroid_management_v2312.py'
      - 'or_preop_physiology_v204.py'
      - 'audit_or_parathyroid_management_v2313.py'
      - 'or_preop_decision_v212.py'
      - 'runtime_entry.py'
      - 'data.py'
      - '.github/workflows/or-v2313-parathyroid.yml'

jobs:
  parathyroid-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: v23.13 parathyroid OR planning and postoperative rescue gate
        run: python audit_or_parathyroid_management_v2313.py
