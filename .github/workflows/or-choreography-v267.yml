name: OR Tomorrow choreography v26.7

on:
  push:
    branches: [main]
    paths:
      - 'audit_or_choreography_v267.py'
      - 'or_procedure_sequences_v200.py'
      - 'or_procedure_sequences_v201.py'
      - 'or_procedure_sequences_v202.py'
      - 'or_*.py'
      - 'runtime_entry.py'
      - '.github/workflows/or-choreography-v267.yml'
  workflow_dispatch:

jobs:
  choreography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Adversarial OR choreography gate
        run: python audit_or_choreography_v267.py
