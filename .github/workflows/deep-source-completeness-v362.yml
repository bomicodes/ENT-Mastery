name: Deep Curriculum source completeness v36.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deep_curriculum_otology_v362.py'
      - 'audit_deep_source_completeness_v362.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'templates/curriculum_depth.html'
      - '.github/workflows/deep-source-completeness-v362.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deep_curriculum_otology_v362.py'
      - 'audit_deep_source_completeness_v362.py'
      - 'deep_curriculum_production_chain_v314.py'
      - 'templates/curriculum_depth.html'
      - '.github/workflows/deep-source-completeness-v362.yml'

jobs:
  vestibular-schwannoma-source-completeness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Exact-live Vestibular Schwannoma source, depth, renderer and backlog gate
        run: python audit_deep_source_completeness_v362.py
      - name: Strict 325-topic canonical coverage contract
        run: python audit_coverage_v135.py --depth --strict
      - name: Full Otology ladder hard gate
        run: python audit_otology_ladder_complete_v232.py
      - name: Reviewed-ladder answer-balance regression
        run: python audit_ladder_answer_balance_v211.py
      - name: Fail-closed global release manifest
        run: python audit_global_release_integrity_v311.py
