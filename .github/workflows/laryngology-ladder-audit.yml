name: CI - Laryngology Ladder Progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vignette_ladders_v249.py'
      - 'vignette_ladders_v251.py'
      - 'vignette_ladders_v252.py'
      - 'vignette_ladders_v253.py'
      - 'laryngology_foundation_alignment_v252.py'
      - 'ladder_answer_balance_v211.py'
      - 'audit_ladder_answer_balance_v211.py'
      - 'audit_laryngology_ladder_progress_v249.py'
      - 'audit_laryngology_ladder_progress_v251.py'
      - 'audit_laryngology_ladder_progress_v252.py'
      - 'audit_laryngology_ladder_progress_v253.py'
      - 'audit_learning_ladders_runtime_v204.py'
      - 'audit_domain_ladder_inventory_v217.py'
      - 'runtime_entry.py'
      - '.github/workflows/laryngology-ladder-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Runtime ladder integrity
        run: python audit_learning_ladders_runtime_v204.py
      - name: Exact canonical domain inventory
        run: python audit_domain_ladder_inventory_v217.py
      - name: v25.3 Laryngology 20-topic progress hard gate
        run: python audit_laryngology_ladder_progress_v253.py
      - name: Answer-balance regression gate
        run: python audit_ladder_answer_balance_v211.py

# This workflow protects deliberate-review progress while Laryngology is being
# completed. It must grow with each canonical batch and eventually be replaced
# by a full-domain completion gate; it does not weaken the global quality suite.
