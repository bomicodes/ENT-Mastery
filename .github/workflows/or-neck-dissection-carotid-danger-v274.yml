name: OR neck dissection carotid danger v27.4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'or_neck_dissection_carotid_danger_v274.py'
      - 'or_reconstruction_bailouts_v270.py'
      - 'audit_or_neck_dissection_carotid_danger_v274.py'
      - 'runtime_entry.py'
      - '.github/workflows/or-neck-dissection-carotid-danger-v274.yml'
      - '.github/workflows/release-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'or_neck_dissection_carotid_danger_v274.py'
      - 'or_reconstruction_bailouts_v270.py'
      - 'audit_or_neck_dissection_carotid_danger_v274.py'
      - 'runtime_entry.py'
      - '.github/workflows/or-neck-dissection-carotid-danger-v274.yml'
      - '.github/workflows/release-integrity.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-flight boot gate
        run: python preflight_boot_check_v155.py
      - name: Neck-dissection carotid-danger gate
        run: python audit_or_neck_dissection_carotid_danger_v274.py
