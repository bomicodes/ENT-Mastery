<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#1f5eff;--good:#0f8a5f;--bad:#b42318;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{background:#111827;color:#e5e7eb;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;letter-spacing:.08em;margin-bottom:18px}.back{display:block;color:#a5b4fc;font-size:13px;margin-bottom:22px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8;margin:18px 8px 8px}.chapter-link{display:block;padding:10px;border-radius:9px;font-size:14px;line-height:1.25;margin:3px 0}.chapter-link:hover,.chapter-link.active{background:#253047;color:white}.chapter-link small{display:block;color:#94a3b8;margin-top:3px}.main{padding:34px;max-width:1100px;width:100%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:var(--muted);max-width:720px}.progress-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:190px}.progress-card b{font-size:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.badge{display:inline-block;background:var(--soft);color:#274690;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.section-list{columns:2;gap:24px;padding-left:20px}.section-list li{break-inside:avoid;margin:6px 0}.must li{margin:8px 0}.quiz-q{border-top:1px solid var(--line);padding:18px 0}.quiz-q:first-child{border-top:0}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;padding:11px 12px;border-radius:10px;margin:7px 0;cursor:pointer}.choice:hover{border-color:#9cb6ff}.choice.correct{border-color:var(--good);background:#ecfdf3}.choice.wrong{border-color:var(--bad);background:#fff1f1}.explain{display:none;color:#374151;background:#f9fafb;border-radius:10px;padding:12px;margin-top:8px}.explain.show{display:block}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--accent);color:white}.btn.secondary{background:#eef2f7;color:#334155}.chapter-score{font-size:13px;color:var(--muted);margin-top:8px}.note{font-size:12px;color:var(--muted)}@media(max-width:800px){.shell{display:block}.side{position:relative;height:auto}.main{padding:20px}.grid{grid-template-columns:1fr}.section-list{columns:1}.hero{display:block}.progress-card{margin-top:16px}}
</style>

<body><div class="shell"><aside class="side"><div class="brand">ENT MASTERY · PASHA</div><a class="back" href="/">← Back to ENT Mastery</a><h3>Chapters</h3><div id="nav"></div><h3>How to use</h3><div class="note" style="color:#94a3b8;padding:0 8px">Read the chapter → scan Must Know → take the quiz → repeat missed items. Progress is saved on this device.</div></aside><main class="main"><div id="app"></div></main></div>
<script>
const chapters=[
{id:1,title:'Allergy and Rhinology',sections:['Anatomy of the Nose and Paranasal Sinuses','Physiology of the Nose and Paranasal Sinuses','Evaluation of Nasal Obstruction','Nasal Diseases','Allergy and Rhinitis','Paranasal Sinus Disease','Sinus Surgery','Immunology'],must:['Localize obstruction before treating it: septum, turbinate, valve, inflammatory disease, mass, or sinus pathology.','Know the anatomy that determines sinus drainage pathways and operative risk.','Differentiate allergic, nonallergic, infectious, inflammatory, and structural causes of nasal symptoms.','For sinus disease, connect symptoms and endoscopy/imaging to appropriate medical therapy and surgical indications.'],qs:[['A patient has dynamic lateral nasal wall collapse that improves with a modified Cottle maneuver. Which structure is most directly implicated?',['Internal nasal valve region','Sphenoid ostium','Nasolacrimal duct','Posterior choana'],0,'Dynamic improvement with lateralization supports nasal valve dysfunction rather than sinus outflow disease.'],['Which finding most strongly favors allergic rhinitis over isolated viral rhinitis?',['Seasonal sneezing, itching, watery rhinorrhea and pale edematous mucosa','Three days of fever and purulent rhinorrhea','Unilateral foul drainage','Fixed unilateral obstruction with epistaxis'],0,'Itching, sneezing, watery rhinorrhea and pale/boggy mucosa are classic allergic features.'],['During endoscopic sinus surgery, which complication is most directly associated with violation of the lamina papyracea?',['Orbital injury','CSF leak from cribriform plate','Internal carotid injury','Facial nerve paralysis'],0,'The lamina papyracea forms the thin medial orbital wall.'],['A patient with chronic rhinosinusitis remains symptomatic after appropriate medical therapy. What is the key purpose of preoperative CT?',['Define anatomy and extent of disease for surgical planning','Confirm bacterial species','Measure nasal airflow','Replace nasal endoscopy'],0,'CT defines sinonasal anatomy, disease distribution and surgical risk landmarks.'],['Which history should raise the most concern for a unilateral sinonasal neoplasm rather than uncomplicated inflammatory disease?',['Progressive unilateral obstruction with recurrent epistaxis','Bilateral seasonal congestion','Sneezing around cats','Clear rhinorrhea during exercise'],0,'Progressive unilateral symptoms plus bleeding are red flags for tumor.']]},
{id:2,title:'Laryngology',sections:['Laryngeal Anatomy and Physiology','The Hoarse (Dysphonic) Patient','Upper Airway Obstruction','Benign Laryngeal Pathology','Neurogenic and Other Vocal Pathologies','Esophageal and Swallowing Disorders'],must:['Localize dysphonia to structural, inflammatory, neurologic, functional, or malignant causes.','Know intrinsic laryngeal muscle innervation and the consequences of vagal, RLN, and SLN injury.','Treat airway compromise before completing an elegant diagnostic workup.','Separate oropharyngeal from esophageal dysphagia and aspiration risk.'],qs:[['After thyroid surgery, a patient has a breathy voice and an immobile vocal fold in paramedian position. Which nerve was most likely injured?',['Recurrent laryngeal nerve','External branch of superior laryngeal nerve','Hypoglossal nerve','Glossopharyngeal nerve'],0,'RLN injury produces vocal fold paresis/paralysis; the exact resting position varies with injury pattern.'],['Loss of high-pitch projection after neck surgery most directly suggests injury to which nerve?',['External branch of the superior laryngeal nerve','Recurrent laryngeal nerve','Greater auricular nerve','Lingual nerve'],0,'The external SLN innervates cricothyroid, which lengthens and tenses the vocal fold.'],['A smoker has persistent hoarseness for six weeks. What is the most appropriate next step?',['Visualize the larynx','Empiric antibiotics for one month','Observe for six more months','Order a barium swallow only'],0,'Persistent dysphonia, especially with risk factors, requires laryngeal visualization.'],['Which symptom most strongly suggests oropharyngeal rather than distal esophageal dysphagia?',['Coughing immediately when swallowing liquids','Food sticking several seconds after the swallow','Progressive solid-food dysphagia only','Substernal pressure after meals'],0,'Immediate cough/choke during the swallow suggests impaired airway protection or oropharyngeal transfer.'],['A patient with bilateral vocal fold immobility develops inspiratory stridor. What is the first priority?',['Secure and assess the airway','Start proton-pump inhibitor therapy','Schedule voice therapy','Perform esophageal dilation'],0,'Bilateral immobility can critically narrow the glottic airway; airway safety comes first.']]},
{id:3,title:'Otolaryngologic Endocrinology',sections:['Thyroid','Parathyroids'],must:['Interpret thyroid nodules using ultrasound risk features, cytology, symptoms, and patient context.','Know the operative anatomy of the RLN, EBSLN, parathyroids, and thyroid vascular pedicles.','Understand primary hyperparathyroidism localization versus diagnosis: biochemical diagnosis comes first.','Recognize postoperative hypocalcemia, hematoma, and nerve injury early.'],qs:[['A patient has elevated calcium and inappropriately elevated PTH. What does this establish before localization imaging?',['Biochemical primary hyperparathyroidism','Parathyroid adenoma location','Parathyroid carcinoma','Need for bilateral exploration in every case'],0,'Primary hyperparathyroidism is a biochemical diagnosis; imaging is for localization, not diagnosis.'],['Which postoperative thyroidectomy complication requires the most immediate bedside action?',['Expanding neck hematoma with respiratory distress','Mild transient hoarseness','Asymptomatic calcium of 8.3 mg/dL','Small seroma'],0,'An expanding hematoma can rapidly compromise the airway and demands immediate decompression/airway management.'],['The external branch of the superior laryngeal nerve is most at risk near which thyroid pole?',['Superior pole','Inferior pole','Isthmus only','Tubercle of Zuckerkandl only'],0,'EBSLN travels near the superior thyroid vascular pedicle and cricothyroid muscle.'],['A thyroid nodule has suspicious ultrasound features. Which test generally provides the next tissue-level risk stratification?',['Fine-needle aspiration cytology','PET for every nodule','Open biopsy','Bone scan'],0,'FNA is the standard tissue sampling method for appropriately selected nodules.'],['After parathyroidectomy, a patient develops marked hypocalcemia with high bone turnover. What phenomenon should be considered?',['Hungry bone syndrome','Thyroid storm','SIADH','Refeeding syndrome'],0,'Rapid skeletal uptake of calcium after correction of hyperparathyroidism can produce hungry bone syndrome.']]},
{id:4,title:'Sleep Medicine',sections:['Sleep Physiology','Polysomnography (PSG)','Sleep-Disordered Breathing (SDB)','Other Sleep-Related Disorders'],must:['Read the PSG as physiology, not just an AHI number.','Distinguish obstructive, central, and mixed respiratory events.','Match treatment to anatomy, disease severity, symptoms, comorbidity, and PAP tolerance.','Know where ENT procedures fit relative to PAP, oral appliances, weight management, and positional therapy.'],qs:[['Which PSG variable is used most commonly to quantify obstructive sleep apnea severity in adults?',['Apnea-hypopnea index','Sleep latency alone','REM percentage alone','Arousal index alone'],0,'AHI is the conventional event-frequency metric, though clinical severity is broader than AHI alone.'],['A patient has persistent OSA despite prior palatal surgery. Before additional surgery, what is most useful for identifying levels/patterns of collapse?',['Drug-induced sleep endoscopy in an appropriate surgical candidate','Routine temporal bone CT','Pure-tone audiogram','Barium esophagram'],0,'DISE can characterize dynamic upper-airway collapse and guide selected surgical planning.'],['Which finding is required for an obstructive apnea rather than a central apnea?',['Continued respiratory effort despite absent/reduced airflow','No respiratory effort','Normal airflow','Only leg movements'],0,'Obstructive events show ongoing effort against an occluded airway.'],['A PAP-intolerant adult asks about hypoglossal nerve stimulation. Which principle is most important?',['Candidacy depends on defined clinical/anatomic criteria, not PAP intolerance alone','Every patient with snoring qualifies','It treats central apnea primarily','BMI and collapse pattern never matter'],0,'HNS requires selection criteria including OSA phenotype and airway-collapse assessment.'],['In pediatric OSA with adenotonsillar hypertrophy, the classic first-line surgical treatment is:',['Adenotonsillectomy','Uvulopalatopharyngoplasty in every child','Tracheotomy','Mandibular fracture repair'],0,'Adenotonsillectomy is the standard initial surgical treatment for many children with adenotonsillar hypertrophy and OSA.']]},
{id:5,title:'General Otolaryngology',sections:['Oral and Oropharyngeal Benign Disorders','Salivary Gland Anatomy and Physiology','General Salivary Gland Pathology','Benign Salivary Gland Tumors','Salivary Gland Malignancy','Salivary Gland Surgery','Odontogenic, Jaw, and Bone Pathology','Neck Masses','Neck Planes, Spaces, and Infection','Head and Neck Manifestations of Systemic Diseases'],must:['Treat an adult neck mass as malignant until a careful workup proves otherwise.','Know salivary anatomy, facial nerve relationships, and the clues that distinguish inflammatory from neoplastic disease.','Localize deep-neck infections by fascial space because complications follow anatomy.','Recognize when oral lesions require biopsy rather than empiric treatment.'],qs:[['A 55-year-old smoker has a persistent lateral neck mass for six weeks. What principle should guide evaluation?',['Assume possible malignancy until adequately evaluated','Treat as a branchial cleft cyst without imaging','Observe for one year','Incise and drain immediately'],0,'A persistent adult neck mass requires malignancy-focused evaluation.'],['Pain and swelling of the submandibular gland that worsens with meals most strongly suggests:',['Obstructive sialadenitis from a stone or stricture','Vocal fold paralysis','Ménière disease','Thyroglossal duct cyst'],0,'Meal-related salivary pain/swelling is classic for duct obstruction.'],['Which cranial nerve is the key motor structure at risk during parotidectomy?',['Facial nerve','Hypoglossal nerve','Optic nerve','Abducens nerve'],0,'The facial nerve traverses the parotid and is central to parotid surgical anatomy.'],['A rapidly spreading odontogenic infection elevates the tongue and floor of mouth. What is the immediate concern?',['Airway compromise in Ludwig angina','Conductive hearing loss','CSF leak','Vocal tremor'],0,'Ludwig angina can progress rapidly to life-threatening airway obstruction.'],['Which feature of a salivary mass most raises concern for malignancy?',['Facial weakness associated with a parotid mass','Slow mobile painless mass alone','Symptoms only during meals','Bilateral mild fullness during dehydration'],0,'Facial nerve dysfunction with a parotid mass is a major malignant red flag.']]},
{id:6,title:'Head and Neck Cancer',sections:['Cancer Staging Index','Introduction to Head and Neck Cancer','Chemotherapy and Radiation Therapy','Cancer of the Neck','Oral Cancer','Oropharyngeal Cancer','Hypopharyngeal Cancer','Laryngeal Cancer','Nasopharyngeal Cancer','Nasal and Paranasal Cancer','Cutaneous Malignancies','Other Head and Neck Neoplasms','Robotic Surgery'],must:['Stage from the primary site, nodal disease, and distant disease while respecting site-specific rules.','HPV-associated oropharyngeal cancer is biologically and staging-wise distinct from classic tobacco-related disease.','Unknown-primary workup should be systematic and preserve future treatment options.','Treatment decisions integrate oncologic control, function, anatomy, pathology, and multidisciplinary therapy.'],qs:[['A cystic level II neck node in an adult should prompt particular concern for metastatic disease from which site?',['HPV-associated oropharynx','External auditory canal only','Thyroid in every case','Paranasal sinus exclusively'],0,'HPV-associated oropharyngeal SCC commonly presents with cystic cervical nodal metastasis.'],['For a new head and neck SCC, why is precise subsite identification important?',['Staging rules, nodal patterns and treatment differ by primary site','All head and neck sites use identical staging','It only affects billing','It eliminates the need for pathology'],0,'Subsite drives staging, expected spread, function and treatment strategy.'],['A patient has metastatic cervical SCC with no obvious primary on office exam. What is the next principle?',['Systematic unknown-primary evaluation including appropriate imaging and directed mucosal assessment','Immediate neck dissection without further evaluation in every case','Assume skin primary','Treat with antibiotics only'],0,'Unknown-primary management requires structured imaging/pathology and directed upper-aerodigestive evaluation.'],['Which functional goal is especially central when choosing treatment for laryngeal cancer?',['Preserve oncologic control while considering airway, voice and swallowing','Preserve smell only','Avoid all pathology review','Treat nodal disease independently of the primary'],0,'Laryngeal therapy requires balancing cancer control with airway, phonation and swallowing.'],['A lower-lip cutaneous SCC has perineural symptoms. What does this imply?',['Higher-risk disease requiring careful nerve-pathway and regional evaluation','Benign behavior','No relevance to treatment','Guaranteed distant metastasis'],0,'Clinical/perineural invasion is a high-risk feature that changes evaluation and management.']]},
{id:7,title:'Otology and Neurotology',sections:['Anatomy, Embryology, and Physiology of Hearing and Balance','Audiology and Hearing Devices','Approach to Hearing Loss and Tinnitus','Infections of the Ear and Temporal Bone','Noninfectious Disorders of the Ear and Temporal Bone','Visualization Tools in Otologic/Neurotologic Surgery','Vestibular Pathology','The Facial Nerve'],must:['Use the audiogram to localize conductive, sensorineural, and mixed loss before naming a disease.','Separate uncomplicated external/middle-ear infection from invasive temporal-bone disease.','For dizziness, distinguish true episodic vertigo from imbalance and then localize peripheral versus central patterns.','Know facial nerve anatomy from brainstem to distal branches and how lesion level changes associated findings.'],qs:[['An audiogram shows an air-bone gap with preserved bone thresholds. What type of loss is present?',['Conductive hearing loss','Sensorineural hearing loss','Central auditory processing disorder','Auditory neuropathy by definition'],0,'An air-bone gap indicates impaired sound conduction through the external or middle ear.'],['A diabetic older adult has severe nocturnal otalgia, persistent otorrhea and granulation tissue despite topical therapy. What diagnosis is most concerning?',['Necrotizing otitis externa','Simple cerumen impaction','Otosclerosis','BPPV'],0,'Disproportionate persistent pain and granulation in a high-risk patient should trigger concern for invasive external-ear/skull-base infection.'],['Brief vertigo triggered by rolling in bed, with a characteristic positional nystagmus, most strongly suggests:',['Benign paroxysmal positional vertigo','Vestibular schwannoma in every case','Acute otitis media','Otosclerosis'],0,'Short position-triggered attacks with typical nystagmus are classic for BPPV.'],['Unilateral sudden sensorineural hearing loss is best treated as:',['An otologic urgency requiring prompt evaluation and time-sensitive therapy','A condition to observe for six months before testing','Conductive loss until proven otherwise','A routine cerumen problem'],0,'SSNHL requires prompt confirmation and treatment consideration because delay can affect outcome.'],['A patient with facial paralysis also has hyperacusis. The lesion must be proximal to the branch supplying which muscle?',['Stapedius','Masseter','Genioglossus','Cricothyroid'],0,'Loss of stapedius function from a proximal facial-nerve lesion can cause hyperacusis.']]},
{id:8,title:'Reconstructive and Facial Plastic Surgery',sections:['Fundamentals of Wound Healing','Head and Neck Reconstructive Flaps','Grafts, Implants, and Expanders','Facial Reconstruction Techniques','Facial Aesthetic Surgery','Rhinoplasty','Otoplasty','Blepharoplasty','Rhytidoplasty','Forehead Lift and Brow Lift','Liposurgery','Complications of Rhytidectomy, Brow Lift, Liposurgery','Chin and Malar Augmentation','Facial Resurfacing','Fillers, Skin Substitutes, and Injections','Alopecia','Incision/Excision Planning and Scar Revisions'],must:['Reconstruct by defect requirements: lining, support, cover, contour, function, and donor morbidity.','Know the reconstructive ladder but do not choose the simplest option if it cannot meet the functional need.','In facial aesthetic surgery, anatomy and complication prevention are as important as technique selection.','Rhinoplasty requires simultaneous control of airway function and structural aesthetics.'],qs:[['A through-and-through cheek defect needs mucosal lining and external skin coverage. What reconstructive principle is most important?',['Replace each missing tissue layer with appropriate vascularized tissue','Use skin graft alone regardless of depth','Ignore oral lining','Close under maximal tension'],0,'Composite defects must restore the distinct tissue layers needed for function and durability.'],['Which factor most directly threatens survival of a newly transferred free flap in the early postoperative period?',['Vascular pedicle compromise','Mild postoperative edema alone','Temporary numbness','Scar maturation'],0,'Arterial or venous compromise can rapidly threaten flap viability and requires urgent recognition.'],['In rhinoplasty, loss of adequate structural support can cause:',['Functional nasal obstruction as well as cosmetic deformity','Only temporary anosmia','Middle-ear effusion','Vocal fold paralysis'],0,'Rhinoplasty changes can alter valve geometry and support, affecting both appearance and airflow.'],['A scar crossing relaxed skin tension lines under high tension is more likely to:',['Widen or become conspicuous','Become invisible immediately','Cause conductive hearing loss','Produce hypocalcemia'],0,'Tension and unfavorable orientation increase scar widening and visibility.'],['The reconstructive ladder is best understood as:',['A framework for selecting the least complex option that reliably meets defect needs','A rule that free flaps are always last and never preferred initially','A cosmetic-only concept','A staging system for cancer'],0,'Reconstruction should be no more complex than necessary, but complex tissue needs may justify advanced reconstruction early.']]},
{id:9,title:'Pediatric Otolaryngology',sections:['The Pediatric Encounter','General Pediatric Otolaryngology and Pediatric Sleep','Pediatric Rhinology','Pediatric Laryngoesophagology','Pediatric Salivary Glands','Pediatric Otology','Pediatric Syndromes and Congenital Disorders','Pediatric Head and Neck Surgery','Pediatric Reconstructive and Facial Plastic Surgery','Pediatric Head and Neck Trauma'],must:['Age changes the differential, airway risk, physiology, and threshold for intervention.','For pediatric airway disease, distinguish congenital, inflammatory, infectious, neurologic, and acquired stenotic processes.','In pediatric otology, connect disease duration and hearing impact to developmental consequences.','Know the major syndromic associations that predict airway, hearing, and craniofacial problems.'],qs:[['A child with recurrent acute otitis media is being considered for tubes. Which issue matters beyond infection count alone?',['Middle-ear status, hearing, speech/language risk and guideline-based candidacy','Eye color','Hand dominance','Dental eruption only'],0,'Tube decisions incorporate effusion status, hearing/developmental risk and clinical course.'],['A toddler has acute inspiratory stridor with a barking cough and no toxic appearance. Which diagnosis is most likely?',['Croup','Epiglottitis by definition','Bilateral choanal atresia','Peritonsillar abscess'],0,'Barking cough with inspiratory stridor in a nontoxic child is typical of viral croup.'],['Which pediatric airway presentation should make epiglottitis a major concern?',['Toxic child with drooling, dysphagia and tripod positioning','Isolated chronic snoring','Barking cough with good oral intake','Stable unilateral otalgia'],0,'Drooling, severe dysphagia, toxicity and tripod posture suggest supraglottic airway infection.'],['A child with adenotonsillar hypertrophy and OSA undergoes surgery. What postoperative issue is most important in higher-risk children?',['Respiratory compromise requiring appropriate observation','Immediate adult-dose opioid escalation','Routine anticoagulation','Mandatory neck dissection'],0,'Selected children with severe OSA, young age or comorbidity need careful postoperative respiratory monitoring.'],['A newborn has biphasic stridor and poor feeding. What is the correct general approach?',['Assess airway stability and localize the obstruction before assuming a diagnosis','Treat all neonatal stridor as asthma','Wait until adolescence','Order only a hearing test'],0,'Neonatal stridor requires airway assessment and anatomic/functional localization.']]},
{id:10,title:'Head and Neck Trauma',sections:['Evaluation of the Head and Neck Trauma Patient','Mandibular Fractures','Maxillary Fractures','Zygomaticomaxillary and Orbital Fractures','Frontal Sinus and Naso-Orbitoethmoid Fractures','Nasal Fractures','Temporal Bone and Otologic Trauma','Penetrating Head and Neck Trauma','Laryngeal Trauma','Soft Tissue Trauma'],must:['Start with airway and hemorrhage before detailed facial fracture classification.','Occlusion is a functional vital sign in mandibular and midface trauma.','Orbital trauma requires recognition of vision-threatening emergencies and entrapment.','Penetrating and laryngeal injuries demand anatomy-based evaluation for aerodigestive and vascular injury.'],qs:[['In major facial trauma, the first priority is:',['Airway with cervical-spine-aware resuscitation','Cosmetic fracture reduction','Dental impressions','Scar revision'],0,'Trauma evaluation follows resuscitation priorities; airway and life-threatening bleeding precede definitive repair.'],['A mandibular fracture patient reports that the teeth no longer fit together normally. This finding is called:',['Malocclusion','Trismus only','Dysphonia','Diplopia'],0,'Malocclusion is a key sign of disrupted mandibular/maxillary alignment.'],['A child with an orbital floor trapdoor fracture has nausea, bradycardia and restricted upgaze. What is the concern?',['Extraocular muscle entrapment with oculocardiac reflex','Isolated nasal septal hematoma','Temporal bone fracture','Simple subconjunctival hemorrhage'],0,'Trapdoor entrapment can provoke an oculocardiac reflex and requires urgent recognition.'],['After nasal trauma, which finding requires prompt drainage to prevent cartilage necrosis?',['Septal hematoma','Mild ecchymosis','Small superficial abrasion','Transient epistaxis that stopped'],0,'A septal hematoma compromises septal cartilage blood supply and must be drained.'],['A patient with blunt neck trauma has hoarseness, hemoptysis and increasing stridor. What is the priority?',['Controlled airway evaluation and management for possible laryngeal injury','Immediate oral feeding','Discharge without imaging or endoscopy','Pure-tone audiometry only'],0,'Progressive airway symptoms after neck trauma require urgent controlled airway management and laryngeal assessment.']]}
];
const KEY='entMasteryPashaProgressV1';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let active=Number(location.hash.replace('#chapter-',''))||1;
function scoreFor(id){const s=state[id]||{};return {done:Object.keys(s).length,correct:Object.values(s).filter(Boolean).length}}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML=chapters.map(c=>{const s=scoreFor(c.id);return `<a class="chapter-link ${c.id===active?'active':''}" href="#chapter-${c.id}" onclick="active=${c.id};render()">${c.id}. ${c.title}<small>${s.done?`${s.correct}/${s.done} correct`:'Not started'}</small></a>`}).join('')}
function render(){const c=chapters.find(x=>x.id===active)||chapters[0];const s=scoreFor(c.id);const overall=chapters.reduce((a,x)=>a+scoreFor(x.id).done,0);const total=chapters.reduce((a,x)=>a+x.qs.length,0);document.getElementById('app').innerHTML=`<div class="hero"><div><span class="badge">Pasha 6e · Chapter ${c.id}</span><h1>${c.title}</h1><p>Chapter-linked retrieval practice: review the section map, scan the high-yield synthesis, then test yourself without looking back.</p></div><div class="progress-card"><small>Overall review progress</small><br><b>${overall}/${total}</b><div class="chapter-score">Chapter: ${s.correct}/${s.done||0} correct</div></div></div><div class="grid"><section class="card"><h2>Chapter map</h2><ul class="section-list">${c.sections.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="card"><h2>Must know after reading</h2><ul class="must">${c.must.map(x=>`<li>${x}</li>`).join('')}</ul></section></div><section class="card"><h2>Test your knowledge</h2><p class="note">These are original review questions aligned to the chapter topics; they do not reproduce textbook question text.</p>${c.qs.map((q,i)=>`<div class="quiz-q"><b>${i+1}. ${q[0]}</b>${q[1].map((ch,j)=>`<button class="choice" data-i="${i}" data-j="${j}" onclick="answer(${i},${j},this)">${ch}</button>`).join('')}<div class="explain" id="e-${i}"><b>Answer:</b> ${q[1][q[2]]}<br>${q[3]}</div></div>`).join('')}<div class="controls"><button class="btn secondary" onclick="resetChapter()">Reset this chapter</button><button class="btn" onclick="nextChapter()">Next chapter →</button></div></section><section class="card"><b>Source framework</b><p class="note">Chapter organization follows Raza Pasha & Justin Golub, <i>Otolaryngology–Head and Neck Surgery: Clinical Reference Guide</i>, 6th ed. This review layer is an original educational companion and should be cross-checked against current guidelines/evidence where management has changed.</p></section>`;renderNav();restore(c)}
function answer(i,j,btn){const c=chapters.find(x=>x.id===active);const correct=j===c.qs[i][2];state[active]=state[active]||{};state[active][i]=correct;localStorage.setItem(KEY,JSON.stringify(state));document.querySelectorAll(`[data-i="${i}"]`).forEach((b,k)=>{b.disabled=true;if(k===c.qs[i][2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});document.getElementById(`e-${i}`).classList.add('show');renderNav()}
function restore(c){const s=state[c.id]||{};Object.keys(s).forEach(i=>{const qi=Number(i),ans=c.qs[qi][2];document.querySelectorAll(`[data-i="${qi}"]`).forEach((b,k)=>{b.disabled=true;if(k===ans)b.classList.add('correct')});document.getElementById(`e-${qi}`)?.classList.add('show')})}
function resetChapter(){delete state[active];localStorage.setItem(KEY,JSON.stringify(state));render()}
function nextChapter(){active=active===chapters.length?1:active+1;location.hash='chapter-'+active;render()}
window.addEventListener('hashchange',()=>{active=Number(location.hash.replace('#chapter-',''))||1;render()});render();
</script></body></html>
