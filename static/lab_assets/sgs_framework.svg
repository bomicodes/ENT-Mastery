<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Subglottic stenosis: grade it, then describe it" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d33">Subglottic stenosis: grade it, then describe it</text><text x="450.0" y="52" text-anchor="middle" font-size="12.5" fill="#5b6b70">Axial views looking down the subglottis; dark area = remaining lumen</text><circle cx="120" cy="190" r="76" fill="#dfe6ea" stroke="#8a97a0" stroke-width="2"/><circle cx="120" cy="190" r="66" fill="#e9a99a" stroke="#a85f50" stroke-width="1.5"/><circle cx="120" cy="190" r="53.2" fill="#1d2a30"/><text x="120" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d33">Grade I</text><text x="120" y="308" text-anchor="middle" font-size="12" fill="#5b6b70">0-50% obstruction</text><circle cx="310" cy="190" r="76" fill="#dfe6ea" stroke="#8a97a0" stroke-width="2"/><circle cx="310" cy="190" r="66" fill="#e9a99a" stroke="#a85f50" stroke-width="1.5"/><circle cx="310" cy="190" r="40.7" fill="#1d2a30"/><text x="310" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d33">Grade II</text><text x="310" y="308" text-anchor="middle" font-size="12" fill="#5b6b70">51-70%</text><circle cx="500" cy="190" r="76" fill="#dfe6ea" stroke="#8a97a0" stroke-width="2"/><circle cx="500" cy="190" r="66" fill="#e9a99a" stroke="#a85f50" stroke-width="1.5"/><circle cx="500" cy="190" r="24.7" fill="#1d2a30"/><text x="500" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d33">Grade III</text><text x="500" y="308" text-anchor="middle" font-size="12" fill="#5b6b70">71-99%</text><circle cx="690" cy="190" r="76" fill="#dfe6ea" stroke="#8a97a0" stroke-width="2"/><circle cx="690" cy="190" r="66" fill="#e9a99a" stroke="#a85f50" stroke-width="1.5"/><text x="690" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d33">Grade IV</text><text x="690" y="308" text-anchor="middle" font-size="12" fill="#5b6b70">no detectable lumen</text><text x="80" y="92" font-size="13" font-weight="700" fill="#1f2d33">Cotton-Myer grade: percent reduction of the cross-sectional area (sized with endotracheal tubes)</text><text x="80" y="348" font-size="13" font-weight="700" fill="#1f2d33">Describe more than the grade: these change the operation</text><rect x="80" y="360" width="740" height="26" rx="6" fill="#f4f8f8" stroke="#e3e9ea"/><text x="94" y="377" font-size="12.5" font-weight="700" fill="#1f2d33">Location</text><text x="260" y="377" font-size="12.5" fill="#1f2d33">Subglottis alone, or glottic / tracheal extension?</text><rect x="80" y="390" width="740" height="26" rx="6" fill="#ffffff" stroke="#e3e9ea"/><text x="94" y="407" font-size="12.5" font-weight="700" fill="#1f2d33">Length</text><text x="260" y="407" font-size="12.5" fill="#1f2d33">Short web versus long segment; distance from the vocal folds</text><rect x="80" y="420" width="740" height="26" rx="6" fill="#f4f8f8" stroke="#e3e9ea"/><text x="94" y="437" font-size="12.5" font-weight="700" fill="#1f2d33">Shape</text><text x="260" y="437" font-size="12.5" fill="#1f2d33">Concentric versus eccentric; anterior versus posterior</text><rect x="80" y="450" width="740" height="26" rx="6" fill="#ffffff" stroke="#e3e9ea"/><text x="94" y="467" font-size="12.5" font-weight="700" fill="#1f2d33">Maturity</text><text x="260" y="467" font-size="12.5" fill="#1f2d33">Firm mature scar versus active granulation or inflammation</text><rect x="80" y="480" width="740" height="26" rx="6" fill="#f4f8f8" stroke="#e3e9ea"/><text x="94" y="497" font-size="12.5" font-weight="700" fill="#1f2d33">Posterior glottis</text><text x="260" y="497" font-size="12.5" fill="#1f2d33">Interarytenoid scar or cricoarytenoid fixation?</text><rect x="80" y="510" width="740" height="26" rx="6" fill="#ffffff" stroke="#e3e9ea"/><text x="94" y="527" font-size="12.5" font-weight="700" fill="#1f2d33">Vocal fold mobility</text><text x="260" y="527" font-size="12.5" fill="#1f2d33">Impaired motion changes the reconstruction</text><rect x="80" y="540" width="740" height="26" rx="6" fill="#f4f8f8" stroke="#e3e9ea"/><text x="94" y="557" font-size="12.5" font-weight="700" fill="#1f2d33">Cartilage framework</text><text x="260" y="557" font-size="12.5" fill="#1f2d33">Is the cricoid ring intact or collapsed?</text><rect x="80" y="570" width="740" height="26" rx="6" fill="#ffffff" stroke="#e3e9ea"/><text x="94" y="587" font-size="12.5" font-weight="700" fill="#1f2d33">Patient factors</text><text x="260" y="587" font-size="12.5" fill="#1f2d33">Reflux, eosinophilic disease, pulmonary status, prior surgery</text><text x="450.0" y="628" text-anchor="middle" font-size="11" fill="#5b6b70">Endoscopic dilation, endoscopic repair, laryngotracheal reconstruction or cricotracheal resection depends on all of these, not the grade alone.</text></svg>
