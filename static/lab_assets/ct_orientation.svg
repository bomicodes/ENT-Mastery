t-anchor="end" font-size="12.5" fill="#1f2d33">Paraspinal muscles</text><polyline points="216,540.0 240,540.0 460,482" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="460" cy="482" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="154.0" font-size="12.5" fill="#1f2d33">Trachea (air)</text><polyline points="846,150.0 822,150.0 548,222" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="548" cy="222" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="193.0" font-size="12.5" fill="#1f2d33">Carotid sheath</text><polyline points="846,189.0 822,189.0 720,262" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="720" cy="262" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="232.0" font-size="12.5" fill="#1f2d33">Recurrent laryngeal n. (TE groove)</text><polyline points="846,228.0 822,228.0 570,264" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="570" cy="264" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="271.0" font-size="12.5" fill="#1f2d33">Esophagus</text><polyline points="846,267.0 822,267.0 558,278" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="558" cy="278" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="310.0" font-size="12.5" fill="#1f2d33">Sympathetic trunk</text><polyline points="846,306.0 822,306.0 626,300" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="626" cy="300" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="349.0" font-size="12.5" fill="#1f2d33">Retropharyngeal / danger space</text><polyline points="846,345.0 822,345.0 570,300" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="570" cy="300" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="388.0" font-size="12.5" fill="#1f2d33">Prevertebral fascia</text><polyline points="846,384.0 822,384.0 630,312" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="630" cy="312" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="427.0" font-size="12.5" fill="#1f2d33">Longus colli</text><polyline points="846,423.0 822,423.0 570,326" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="570" cy="326" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="466.0" font-size="12.5" fill="#1f2d33">Vertebral body</text><polyline points="846,462.0 822,462.0 560,366" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="560" cy="366" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="505.0" font-size="12.5" fill="#1f2d33">Spinal cord</text><polyline points="846,501.0 822,501.0 542,420" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="542" cy="420" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><text x="852" y="544.0" font-size="12.5" fill="#1f2d33">Trapezius</text><polyline points="846,540.0 822,540.0 710,492" fill="none" stroke="#3d4b50" stroke-width="0.9" opacity="0.85"/><circle cx="710" cy="492" r="2.2" fill="#1f2d33" stroke="#1f2d33" stroke-width="0.5"/><rect x="110" y="609" width="22" height="14" rx="3" fill="#fbf1c7" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="4 2"/><text x="140" y="620" font-size="12.5" fill="#1f2d33">Visceral space (middle layer of deep cervical fascia)</text><rect x="550" y="609" width="22" height="14" rx="3" fill="#d3eef3" stroke="#1a7f8e" stroke-width="1.4" stroke-dasharray="4 2"/><text x="580" y="620" font-size="12.5" fill="#1f2d33">Carotid space (carotid sheath)</text><rect x="110" y="633" width="22" height="14" rx="3" fill="#f6d6d2" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 2"/><text x="140" y="644" font-size="12.5" fill="#1f2d33">Perivertebral space (deep layer / prevertebral fascia)</text><rect x="550" y="633" width="22" height="14" rx="3" fill="#e7dcf3" stroke="#e7dcf3" stroke-width="1.4" stroke-dasharray="4 2"/><text x="580" y="644" font-size="12.5" fill="#1f2d33">Posterior cervical space</text><text x="530.0" y="680" text-anchor="middle" font-size="12" fill="#5b6b70">Key relationship: in the carotid sheath the artery is medial, the jugular vein lateral and the vagus behind, between them.</text><text x="530.0" y="698" text-anchor="middle" font-size="12" fill="#5b6b70">A mass that pushes both vessels together lies outside the sheath; one that splays them apart arises inside it.</text></svg>
