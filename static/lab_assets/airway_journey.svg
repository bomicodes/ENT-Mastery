<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-label="Airway journey: supraglottis to mainstem bronchi" font-family="Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="540.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d33">Airway journey: supraglottis to mainstem bronchi</text><text x="540.0" y="52" text-anchor="middle" font-size="12.5" fill="#5b6b70">Coronal schematic, front view (patient's right on the viewer's left)</text><path d="M 360 90 Q 340 150 368 200 L 390 232 L 378 250 L 390 268 L 396 300 L 396 340 L 464 340 L 464 300 L 470 268 L 482 250 L 470 232 L 492 200 Q 520 150 500 90" fill="#e9a99a" stroke="#a85f50" stroke-width="2"/><path d="M 374 96 Q 360 150 382 198 L 404 230 L 422 250 L 408 268 L 408 300 L 408 340 L 452 340 L 452 300 L 452 268 L 438 250 L 456 230 L 478 198 Q 500 150 486 96 Z" fill="#1d2a30"/><rect x="390" y="296" width="80" height="22" rx="4" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1.6" opacity="0.92"/><rect x="392" y="340" width="76" height="230" fill="#e9a99a" stroke="#a85f50" stroke-width="2"/><rect x="406" y="340" width="48" height="230" fill="#1d2a30"/><rect x="390" y="350" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="368" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="386" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="404" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="422" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="440" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="458" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="476" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="494" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="512" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="530" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="548" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><rect x="390" y="566" width="80" height="8" rx="3" fill="#dfe6ea" stroke="#8a97a0" stroke-width="1"/><line x1="320" y1="455" x2="540" y2="455" stroke="#b8860b" stroke-dasharray="6 4" stroke-width="1.4"/><text x="546" y="459" font-size="11" fill="#8a6a00">thoracic inlet</text><path d="M 468 570 L 540 650 L 510 664 L 438 590 L 422 590 L 370 650 L 342 640 L 392 570 Z" fill="#e9a99a" stroke="#a85f50" stroke-width="2"/><path d="M 454 572 L 526 650 L 516 655 L 434 584 L 426 584 L 364 644 L 354 638 L 406 572 Z" fill="#1d2a30"/><text x="334" y="682" text-anchor="middle" font-size="13" font-weight="800" fill="#5b6b70">R</text><text x="536" y="682" text-anchor="middle" font-size="13" font-weight="800" fill="#5b6b70">L</text><path d="M 290 93 L 280 93 L 280 225 L 290 225" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="159.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Supraglottis</text><text x="272" y="175.0" text-anchor="end" font-size="11" fill="#5b6b70">epiglottis, AE folds, false folds</text><path d="M 290 231 L 280 231 L 280 259 L 290 259" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="245.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Glottis</text><text x="272" y="261.0" text-anchor="end" font-size="11" fill="#5b6b70">true vocal folds, posterior glottis</text><path d="M 290 265 L 280 265 L 280 317 L 290 317" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="291.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Subglottis</text><text x="272" y="307.0" text-anchor="end" font-size="11" fill="#5b6b70">to the lower border of the cricoid</text><path d="M 290 323 L 280 323 L 280 452 L 290 452" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="387.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Cervical trachea</text><text x="272" y="403.5" text-anchor="end" font-size="11" fill="#5b6b70">rings 1 to about 6</text><path d="M 290 458 L 280 458 L 280 567 L 290 567" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="512.5" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Thoracic trachea</text><text x="272" y="528.5" text-anchor="end" font-size="11" fill="#5b6b70">below the inlet to the carina</text><path d="M 290 573 L 280 573 L 280 661 L 290 661" fill="none" stroke="#3d4b50" stroke-width="1.4"/><text x="272" y="617.0" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f2d33">Carina and mainstem bronchi</text><text x="272" y="633.0" text-anchor="end" font-size="11" fill="#5b6b70">right is wider, shorter, more vertical</text><line x1="490" y1="150" x2="560" y2="150" stroke="#3d4b50" stroke-width="0.9"/><text x="566" y="154" font-size="12" fill="#1f2d33">epiglottis</text><line x1="490" y1="250" x2="560" y2="250" stroke="#3d4b50" stroke-width="0.9"/><text x="566" y="254" font-size="12" fill="#1f2d33">true vocal folds</text><line x1="490" y1="307" x2="560" y2="307" stroke="#3d4b50" stroke-width="0.9"/><text x="566" y="311" font-size="12" fill="#1f2d33">cricoid: the only complete ring</text><line x1="490" y1="400" x2="560" y2="400" stroke="#3d4b50" stroke-width="0.9"/><text x="566" y="404" font-size="12" fill="#1f2d33">tracheal rings (C-shaped; posterior membranous wall)</text><rect x="760" y="110" width="300" height="196" rx="12" fill="#fff8e1" stroke="#d6b45c" stroke-width="1.4"/><text x="776" y="136" font-size="14" font-weight="700" fill="#1f2d33">At every level, ask:</text><text x="776" y="164" font-size="13" fill="#1f2d33">1. Fixed or dynamic?</text><text x="776" y="190" font-size="13" fill="#1f2d33">2. Focal or long segment?</text><text x="776" y="216" font-size="13" fill="#1f2d33">3. Mature scar or active inflammation?</text><text x="776" y="242" font-size="13" fill="#1f2d33">4. Narrowest point, and how narrow?</text><text x="776" y="268" font-size="13" fill="#1f2d33">5. Which levels are involved?</text><text x="776" y="294" font-size="13" fill="#1f2d33">6. What treatment fits that geometry?</text><text x="760" y="360" font-size="12" fill="#5b6b70">Document each finding by level and by distance:</text><text x="760" y="378" font-size="12" fill="#5b6b70">from the vocal folds and above the carina.</text><text x="540.0" y="708" text-anchor="middle" font-size="11" fill="#5b6b70">Schematic, not to scale.</text></svg>
