<rect x="205" y="95" width="110" height="54" rx="9" fill="#eef6f5" stroke="#333"/><text x="260" y="119" text-anchor="middle" font-family="Arial" font-size="12">Inferior turbinate</text><text x="260" y="136" text-anchor="middle" font-family="Arial" font-size="12">/ meatus</text>
<text x="330" y="127" font-family="Arial" font-size="20">→</text>
