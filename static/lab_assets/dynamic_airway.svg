751.1,177.0 752.8,175.0 754.6,173.1 756.4,171.3 758.4,169.5 760.4,167.8 762.5,166.2 764.7,164.6 766.9,163.1 769.3,161.7 771.7,160.3 774.1,159.1 776.7,157.9 779.2,156.8 781.9,155.8 784.6,154.9 787.3,154.1 790.0,153.4 792.8,152.8 795.6,152.2 798.5,151.8 801.3,151.4 804.2,151.2 807.1,151.0 810.0,151.0 812.9,151.0 815.8,151.2 818.7,151.4 821.5,151.8 824.4,152.2 827.2,152.8 830.0,153.4 832.7,154.1 835.4,154.9 838.1,155.8 840.8,156.8 843.3,157.9 845.9,159.1 848.3,160.3 850.7,161.7 853.1,163.1 855.3,164.6 857.5,166.2 859.6,167.8 861.6,169.5 863.6,171.3 865.4,173.1 867.2,175.0 868.9,177.0 870.4,179.0 871.9,181.1 873.3,183.2 874.5,185.4 875.7,187.6 876.7,189.8" fill="none" stroke="#8a97a0" stroke-width="1" stroke-linecap="round"/><circle cx="810" cy="210" r="44" fill="#d98e7f"/><circle cx="810" cy="210" r="18.5" fill="#1d2a30"/><text x="810" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d33">Expiration</text><text x="810" y="296" text-anchor="middle" font-size="11.5" fill="#5b6b70">same narrowing in both phases</text><line x1="480" y1="80" x2="480" y2="330" stroke="#dfe7e7" stroke-width="2"/><text x="70" y="366" font-size="12" font-weight="700" fill="#5b6b70">COMPARE</text><rect x="60" y="380" width="880" height="56" rx="8" fill="#f7f9f9" stroke="#e3e9ea"/><text x="74" y="402" font-size="12.5" font-weight="700" fill="#1f2d33">How to show it</text><text x="230" y="398" font-size="11.5" fill="#1f2d33">Awake or lightly sedated dynamic airway endoscopy with</text><text x="230" y="413" font-size="11.5" fill="#1f2d33">spontaneous breathing; cough or forced expiration;</text><text x="230" y="428" font-size="11.5" fill="#1f2d33">dynamic CT</text><text x="590" y="398" font-size="11.5" fill="#1f2d33">Rigid or flexible endoscopy sized with tubes or the</text><text x="590" y="413" font-size="11.5" fill="#1f2d33">bronchoscope; CT shows a constant narrowing</text><rect x="60" y="444" width="880" height="56" rx="8" fill="#f7f9f9" stroke="#e3e9ea"/><text x="74" y="466" font-size="12.5" font-weight="700" fill="#1f2d33">Anesthesia pitfall</text><text x="230" y="462" font-size="11.5" fill="#1f2d33">Positive pressure or deep paralysis can stent the</text><text x="230" y="477" font-size="11.5" fill="#1f2d33">airway open and hide malacia</text><text x="590" y="462" font-size="11.5" fill="#1f2d33">Visible regardless of breathing phase</text><rect x="60" y="508" width="880" height="56" rx="8" fill="#f7f9f9" stroke="#e3e9ea"/><text x="74" y="530" font-size="12.5" font-weight="700" fill="#1f2d33">Typical causes</text><text x="230" y="526" font-size="11.5" fill="#1f2d33">Congenital, tracheoesophageal fistula/esophageal</text><text x="230" y="541" font-size="11.5" fill="#1f2d33">atresia, vascular compression (innominate artery,</text><text x="230" y="556" font-size="11.5" fill="#1f2d33">rings), prolonged intubation</text><text x="590" y="526" font-size="11.5" fill="#1f2d33">Intubation injury, post-tracheostomy, granulomatous</text><text x="590" y="541" font-size="11.5" fill="#1f2d33">disease, tumor</text><rect x="60" y="572" width="880" height="56" rx="8" fill="#f7f9f9" stroke="#e3e9ea"/><text x="74" y="594" font-size="12.5" font-weight="700" fill="#1f2d33">Treatment direction</text><text x="230" y="590" font-size="11.5" fill="#1f2d33">Observation (many children improve), positive airway</text><text x="230" y="605" font-size="11.5" fill="#1f2d33">pressure, aortopexy or posterior tracheopexy, stent in</text><text x="230" y="620" font-size="11.5" fill="#1f2d33">selected cases</text><text x="590" y="590" font-size="11.5" fill="#1f2d33">Dilation or endoscopic repair for short webs; resection</text><text x="590" y="605" font-size="11.5" fill="#1f2d33">or reconstruction for complex segments</text><text x="500.0" y="664" text-anchor="middle" font-size="11" fill="#5b6b70">Same symptom (stridor, wheeze, failure to extubate) does not mean the same mechanics or the same treatment.</text></svg>
