<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
    <rect width="100%" height="100%" fill="white"/>
    <text x="380" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Dynamic vs Fixed Airway Narrowing</text>
<rect x="90" y="90" width="250" height="220" rx="14" fill="#eef6f5" stroke="#333"/>
<text x="215" y="120" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Dynamic collapse</text>
<ellipse cx="215" cy="205" rx="80" ry="55" fill="white" stroke="#333" stroke-width="2"/>
<ellipse cx="215" cy="205" rx="35" ry="12" fill="#eee" stroke="#333"/>
<text x="215" y="285" text-anchor="middle" font-family="Arial" font-size="12">changes with respiration / pressure</text>
<rect x="420" y="90" width="250" height="220" rx="14" fill="#f7f7f7" stroke="#333"/>
<text x="545" y="120" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Fixed stenosis</text>
<ellipse cx="545" cy="205" rx="80" ry="55" fill="white" stroke="#333" stroke-width="2"/>
<ellipse cx="545" cy="205" rx="28" ry="28" fill="#eee" stroke="#333"/>
<text x="545" y="285" text-anchor="middle" font-family="Arial" font-size="12">structurally narrowed across phases</text>
<text x="380" y="380" text-anchor="middle" font-family="Arial" font-size="12">Same symptom ≠ same mechanics ≠ same treatment.</text>
    </svg>